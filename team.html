<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031019">
  <meta name="description" content="The Process Recovery Center staff directory.">
  <title>Staff Directory | The Process Recovery Center</title>

  <link rel="icon" type="image/png" href="process-mark.png">
  <link rel="preload" as="image" href="process-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --blue:#5bd1ff;
      --blue-bright:#00b8f4;
      --blue-soft:#b6eaff;
      --navy:#061722;
      --navy-2:#031018;
      --black:#01070b;
      --white:#fff;
      --muted:#9eb4bf;
    }

    * { box-sizing:border-box; }

    html, body {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      background:#01070b;
      color:#fff;
      font-family:"Manrope",Arial,Helvetica,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(0,184,244,.11), transparent 30%),
        linear-gradient(180deg,var(--navy) 0%,var(--black) 100%);
    }

    a {
      color:inherit;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    .page {
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:0 auto;
      padding:
        max(22px,env(safe-area-inset-top))
        17px
        max(28px,env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 92% 35%,rgba(0,184,244,.06),transparent 25%),
        linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 55%,#01080c 100%);
      box-shadow:0 0 80px rgba(0,0,0,.58);
    }

    .topbar {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .back {
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      border:1px solid rgba(91,209,255,.28);
      border-radius:50%;
      color:var(--blue-soft);
      background:rgba(255,255,255,.04);
      font-size:25px;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }

    .brand img {
      width:45px;
      height:45px;
      object-fit:contain;
    }

    .brand-copy {
      min-width:0;
    }

    .brand-name {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      text-transform:uppercase;
    }

    .brand-sub {
      margin-top:3px;
      color:var(--muted);
      font-size:8px;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }

    .hero {
      margin-top:27px;
      padding-bottom:18px;
      border-bottom:1px solid rgba(91,209,255,.28);
    }

    h1 {
      margin:0;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:44px;
      line-height:.95;
      letter-spacing:-.6px;
    }

    .intro {
      max-width:390px;
      margin-top:10px;
      color:#b2c7d0;
      font-size:12px;
      line-height:1.55;
    }

    .directory {
      display:grid;
      gap:10px;
      margin-top:18px;
    }

    .staff-card {
      padding:16px;
      border:1px solid rgba(95,190,230,.30);
      border-radius:18px;
      background:
        radial-gradient(circle at 100% 0%,rgba(91,209,255,.07),transparent 45%),
        linear-gradient(145deg,#102d3e,#061620);
      box-shadow:0 10px 25px rgba(0,0,0,.18);
    }

    .staff-name {
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:27px;
      font-weight:700;
      line-height:1;
    }

    .credentials {
      margin-top:6px;
      color:var(--blue-soft);
      font-size:9px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .title {
      margin-top:7px;
      color:#c7d6dc;
      font-size:11px;
      line-height:1.35;
    }

    .actions {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
      margin-top:14px;
    }

    .action {
      min-height:43px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px 5px;
      border:1px solid rgba(91,209,255,.28);
      border-radius:11px;
      color:#d7f3ff;
      background:rgba(255,255,255,.035);
      font-size:9px;
      font-weight:800;
      letter-spacing:.3px;
      text-align:center;
    }

    .action.primary {
      border-color:#38d0ff;
      color:#fff;
      background:linear-gradient(145deg,#0da8df,#056798);
    }

    .state {
      margin-top:18px;
      padding:24px 18px;
      text-align:center;
      border:1px solid rgba(91,209,255,.25);
      border-radius:18px;
      color:var(--muted);
      background:rgba(255,255,255,.035);
      font-size:12px;
      line-height:1.5;
    }

    .footer {
      padding:30px 0 6px;
      text-align:center;
      color:#78909b;
      font-size:8px;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    @media (max-width:370px) {
      h1 { font-size:39px; }
      .actions { grid-template-columns:1fr 1fr; }
      .action.primary { grid-column:1 / -1; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="./" aria-label="Back to digital business card" id="backLink">‹</a>

      <div class="brand">
        <img src="process-mark.png" alt="">
        <div class="brand-copy">
          <div class="brand-name">The Process Recovery Center</div>
          <div class="brand-sub">Staff Directory</div>
        </div>
      </div>
    </div>

    <section class="hero">
      <h1>Our Team</h1>
      <div class="intro">
        View staff credentials and connect directly with members of The Process Recovery Center team.
      </div>
    </section>

    <section id="directory" class="directory">
      <div class="state">Loading staff directory…</div>
    </section>

    <footer class="footer">
      The Process Recovery Center
    </footer>
  </main>

<script>
const DATA_URL = 'data.json';

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

function renderDirectory(snapshot) {
  const target = document.getElementById('directory');
  const staff = Array.isArray(snapshot && snapshot.staff)
    ? snapshot.staff
    : [];

  if (!staff.length) {
    target.innerHTML = '<div class="state">No staff directory information is available right now.</div>';
    return;
  }

  target.innerHTML = staff.map(person => {
    const id = String(person.id || '').trim();
    const name = String(person.name || '').trim();
    const credentials = String(person.credentials || '').trim();
    const title = String(person.title || '').trim();
    const phoneHref = String(person.phoneHref || '').trim();
    const email = String(person.email || '').trim();

    return `
      <article class="staff-card">
        <div class="staff-name">${escapeHtml(name)}</div>
        ${credentials ? `<div class="credentials">${escapeHtml(credentials)}</div>` : ''}
        ${title ? `<div class="title">${escapeHtml(title)}</div>` : ''}

        <div class="actions">
          ${phoneHref ? `
            <a class="action" href="${escapeAttribute(phoneHref)}" aria-label="Call ${escapeAttribute(name)}">
              Call
            </a>
          ` : ''}

          ${email ? `
            <a class="action" href="mailto:${escapeAttribute(email)}" aria-label="Email ${escapeAttribute(name)}">
              Email
            </a>
          ` : ''}

          <a class="action primary" href="./?staff=${encodeURIComponent(id)}" aria-label="View ${escapeAttribute(name)} digital business card">
            View Card
          </a>
        </div>
      </article>
    `;
  }).join('');
}

fetch(DATA_URL, { cache:'no-store' })
  .then(response => {
    if (!response.ok) throw new Error('Directory data unavailable');
    return response.json();
  })
  .then(renderDirectory)
  .catch(() => {
    document.getElementById('directory').innerHTML =
      '<div class="state">The staff directory could not be loaded. Please try again shortly.</div>';
  });
</script>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const fromStaff = String(params.get('from') || '').toLowerCase().trim();
    const backLink = document.getElementById('backLink');

    if (!backLink) return;

    backLink.href = fromStaff
      ? './?staff=' + encodeURIComponent(fromStaff)
      : './';
  })();
</script>

</body>
</html>
