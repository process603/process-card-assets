<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#031019">

  <meta
    name="description"
    content="The Process Recovery Center staff contact and recovery resources."
  >

  <title>The Process Recovery Center</title>

  <link
    rel="icon"
    type="image/png"
    href="process-mark.png"
  >

  <!-- HERO PRELOAD -->
  <link
    rel="preload"
    as="image"
    href="bridge-hero.webp"
    type="image/webp"
    fetchpriority="high"
  >

  <link
    rel="preload"
    as="image"
    href="process-mark.png"
  >

  <!-- CONNECTION WARMUP -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="preconnect"
    href="https://script.google.com"
  >

  <link
    rel="preconnect"
    href="https://script.googleusercontent.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {
      --blue: #5bd1ff;
      --blue-bright: #00b8f4;
      --blue-soft: #b6eaff;

      --navy: #061722;
      --navy-2: #031018;

      --black: #01070b;
      --white: #ffffff;

      --muted: #9eb4bf;
    }


    * {
      box-sizing: border-box;
    }


    html {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow-x: hidden;

      scroll-behavior: smooth;

      background: var(--black);

      -webkit-text-size-adjust: 100%;
    }


    body {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow-x: hidden;

      font-family:
        "Manrope",
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      background:
        radial-gradient(
          circle at 15% 12%,
          rgba(0,184,244,.11),
          transparent 31%
        ),
        linear-gradient(
          180deg,
          var(--navy) 0%,
          var(--black) 100%
        );
    }


    a {
      color: inherit;
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    img {
      user-select: none;
      -webkit-user-drag: none;
    }


    svg {
      display: block;
    }



    /* =====================================================
       MAIN PAGE
    ===================================================== */


    .page {
      position: relative;

      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      min-height: 0;
      height: auto;

      overflow: visible;

      background:
        radial-gradient(
          circle at 92% 46%,
          rgba(0,184,244,.06),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          var(--navy) 0%,
          var(--navy-2) 53%,
          #01080c 100%
        );

      box-shadow:
        0 0 80px rgba(0,0,0,.58);
    }



    /* =====================================================
       FIRST-LOAD FULL PAGE SKELETON
    ===================================================== */


    .loading-shell {
      width: 100%;

      background:
        linear-gradient(
          180deg,
          var(--navy) 0%,
          var(--navy-2) 55%,
          #01080c 100%
        );
    }


    .loading-hero {
      position: relative;

      min-height: 495px;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding:
        max(
          18px,
          env(safe-area-inset-top)
        )
        20px
        25px;

      background-image:
        linear-gradient(
          180deg,
          rgba(2,9,14,.07) 0%,
          rgba(2,9,14,.11) 24%,
          rgba(2,10,16,.25) 46%,
          rgba(3,15,23,.72) 71%,
          var(--navy) 100%
        ),
        url("bridge-hero.webp");

      background-size: cover;
      background-position: center 44%;
    }


    .loading-shell-brand {
      position: absolute;

      top:
        max(
          19px,
          env(safe-area-inset-top)
        );

      left: 20px;

      display: flex;
      align-items: center;

      gap: 11px;

      filter:
        drop-shadow(
          0 3px 7px rgba(0,0,0,.65)
        );
    }


    .loading-shell-brand img {
      width: 67px;
      height: 67px;

      object-fit: contain;
    }


    .loading-brand-copy {
      color: white;

      text-shadow:
        0 2px 7px rgba(0,0,0,.88),
        0 5px 15px rgba(0,0,0,.48);
    }


    .loading-brand-the {
      margin-bottom: 2px;

      font-size: 10px;
      font-weight: 600;

      line-height: 1;

      letter-spacing: 5px;

      text-transform: uppercase;
    }


    .loading-brand-process {
      font-size: 29px;
      font-weight: 700;

      line-height: .96;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .loading-brand-sub {
      margin-top: 6px;

      color: #d9eff8;

      font-size: 8px;
      font-weight: 600;

      line-height: 1;

      letter-spacing: 3px;

      text-transform: uppercase;
    }


    .loading-identity {
      width: 100%;
    }


    .skeleton {
      position: relative;

      overflow: hidden;

      background:
        rgba(255,255,255,.10);
    }


    /* Static skeletons reduce first-load rendering work. */
    .skeleton::after {
      content: none;
    }


    .skeleton-name {
      width: 74%;
      height: 48px;

      margin-bottom: 11px;

      border-radius: 10px;
    }


    .skeleton-credentials {
      width: 34%;
      height: 12px;

      margin-bottom: 14px;

      border-radius: 999px;
    }


    .skeleton-title {
      width: 53%;
      height: 17px;

      margin-bottom: 18px;

      border-radius: 999px;
    }


    .skeleton-actions {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 9px;
    }


    .skeleton-button {
      height: 102px;

      border-radius: 18px;
    }


    .loading-body {
      width: 100%;

      padding:
        0
        17px
        24px;
    }


    .loading-admissions {
      height: 132px;

      margin-bottom: 11px;

      border-radius: 20px;

      border:
        1px solid rgba(18,199,255,.40);

      background:
        rgba(8,39,57,.78);
    }


    .loading-primary-links {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;
    }


    .loading-link {
      height: 108px;

      border-radius: 17px;

      border:
        1px solid rgba(105,188,224,.22);

      background:
        rgba(10,34,48,.70);
    }


    .loading-heading-row {
      display: flex;

      justify-content: space-between;
      align-items: flex-end;

      margin:
        30px
        3px
        14px;

      padding-bottom: 9px;

      border-bottom:
        1px solid rgba(91,209,255,.26);
    }


    .loading-heading-main {
      width: 48%;
      height: 14px;

      border-radius: 999px;
    }


    .loading-heading-side {
      width: 23%;
      height: 22px;

      border-radius: 6px;
    }


    .loading-resource-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;
    }


    .loading-resource {
      height: 178px;

      border-radius: 18px;

      border:
        1px solid rgba(95,190,230,.20);

      background:
        rgba(12,42,58,.62);
    }


    .loading-crisis {
      height: 145px;

      margin-top: 16px;

      border-radius: 20px;

      border:
        1px solid rgba(22,199,255,.28);

      background:
        rgba(7,38,58,.68);
    }


    .loading-footer {
      padding:
        30px
        12px
        26px;

      text-align: center;
    }


    .loading-footer-mark {
      width: 52px;
      height: 52px;

      margin:
        0 auto 12px;

      border-radius: 50%;
    }


    .loading-footer-line {
      width: 150px;
      height: 9px;

      margin:
        8px auto;

      border-radius: 999px;
    }


    .loading-footer-line.short {
      width: 100px;
    }


    .loading-footer-logo {
      width: 132px;
      height: 70px;

      margin:
        14px auto;

      border-radius: 19px;

      background:
        rgba(255,255,255,.10);
    }


    /* =====================================================
       STATE / ERROR CARD
    ===================================================== */


    .state-wrap {
      min-height: 650px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 28px;
    }


    .state-card {
      width: 100%;
      max-width: 360px;

      padding: 32px 26px;

      text-align: center;

      border:
        1px solid rgba(91,209,255,.30);

      border-radius: 20px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(91,209,255,.09),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          rgba(17,46,64,.96),
          rgba(5,20,29,.98)
        );

      box-shadow:
        0 14px 34px rgba(0,0,0,.30);
    }


    .state-icon {
      width: 44px;
      height: 44px;

      margin:
        0 auto 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;

      background:
        linear-gradient(
          145deg,
          #15b8ed,
          #08628f
        );
    }


    .state-icon svg {
      width: 22px;
      height: 22px;
    }


    .state-title {
      font-size: 18px;
      font-weight: 800;
    }


    .state-message {
      margin-top: 8px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.55;
    }


    .state-action-row {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

      margin-top: 20px;
    }


    .state-action {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 44px;

      padding:
        12px
        22px;

      border: none;

      border-radius: 999px;

      font-family: inherit;

      color: white;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      background:
        linear-gradient(
          145deg,
          #0da8df,
          #056798
        );

      box-shadow:
        0 8px 22px rgba(0,153,214,.22);
    }


    .state-action.secondary {
      color: var(--blue-soft);

      border:
        1px solid rgba(91,209,255,.28);

      background:
        rgba(255,255,255,.045);

      box-shadow: none;
    }



    /* =====================================================
       HERO
    ===================================================== */


    .hero {
      position: relative;

      min-height: 495px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      overflow: hidden;

      isolation: isolate;

      padding:
        max(
          18px,
          env(safe-area-inset-top)
        )
        20px
        25px;

      background-image:
        linear-gradient(
          180deg,
          rgba(2,9,14,.07) 0%,
          rgba(2,9,14,.11) 24%,
          rgba(2,10,16,.25) 46%,
          rgba(3,15,23,.72) 71%,
          var(--navy) 100%
        ),
        url("bridge-hero.webp");

      background-size: cover;

      background-position:
        center 44%;
    }


    .hero::before {
      content: "";

      position: absolute;

      inset: 0;

      z-index: -1;

      background:
        radial-gradient(
          circle at 87% 22%,
          rgba(45,188,245,.15),
          transparent 30%
        ),
        linear-gradient(
          90deg,
          rgba(0,50,78,.10),
          transparent 58%
        );

      pointer-events: none;
    }


    .hero::after {
      content: "";

      position: absolute;

      left: -15%;
      right: -15%;
      bottom: -80px;

      height: 180px;

      z-index: -1;

      background:
        var(--navy);

      filter:
        blur(45px);

      opacity: .8;
    }



    /* =====================================================
       TOP BRAND
    ===================================================== */


    .hero-brand {
      position: absolute;

      top:
        max(
          19px,
          env(safe-area-inset-top)
        );

      left: 20px;

      z-index: 4;

      display: flex;

      align-items: center;

      gap: 11px;

      animation:
        brandIn
        .8s
        cubic-bezier(.22,.8,.24,1)
        both;

      filter:
        drop-shadow(
          0 3px 7px rgba(0,0,0,.65)
        )
        drop-shadow(
          0 8px 20px rgba(0,0,0,.38)
        );
    }


    @keyframes brandIn {
      from {
        opacity: 0;

        transform:
          translateY(-12px)
          scale(.98);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .hero-process-mark {
      width: 67px;
      height: 67px;

      flex-shrink: 0;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 8px rgba(73,200,246,.22)
        );
    }


    .hero-brand-copy {
      color: var(--white);

      text-shadow:
        0 2px 7px rgba(0,0,0,.88),
        0 5px 15px rgba(0,0,0,.48);
    }


    .hero-brand-the {
      margin-bottom: 2px;

      font-size: 10px;
      font-weight: 600;

      line-height: 1;

      letter-spacing: 5px;

      text-transform: uppercase;
    }


    .hero-brand-process {
      font-size: 29px;
      font-weight: 700;

      line-height: .96;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .hero-brand-sub {
      margin-top: 6px;

      color: #d9eff8;

      font-size: 8px;
      font-weight: 600;

      line-height: 1;

      letter-spacing: 3px;

      text-transform: uppercase;
    }



    /* =====================================================
       STAFF IDENTITY
    ===================================================== */


    .hero-content {
      position: relative;

      z-index: 3;

      animation:
        heroIn
        .9s
        .08s
        cubic-bezier(.22,.8,.24,1)
        both;
    }


    @keyframes heroIn {
      from {
        opacity: 0;

        transform:
          translateY(18px)
          scale(.985);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .hero-name {
      max-width: 100%;

      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(
          44px,
          11.4vw,
          57px
        );

      font-weight: 700;

      line-height: .90;

      letter-spacing: -.8px;

      text-wrap: balance;

      text-shadow:
        0 3px 10px rgba(0,0,0,.64),
        0 8px 28px rgba(0,0,0,.42);
    }


    .hero-name.long {
      font-size:
        clamp(
          39px,
          10vw,
          50px
        );
    }


    .hero-name.xlong {
      font-size:
        clamp(
          35px,
          8.8vw,
          45px
        );
    }


    .credentials {
      margin-top: 9px;

      color: #bfe9f8;

      font-family:
        "Manrope",
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      font-weight: 700;

      line-height: 1.2;

      letter-spacing: 1.15px;

      text-transform: uppercase;

      text-shadow:
        0 2px 8px rgba(0,0,0,.65);
    }


    .hero-title {
      display: flex;

      align-items: center;

      width: fit-content;

      max-width: 100%;

      gap: 10px;

      margin-top: 13px;

      color: #e7f0f4;

      font-size: 15px;

      font-weight: 500;

      line-height: 1.3;

      text-shadow:
        0 2px 8px rgba(0,0,0,.65);
    }


    .hero-title::before,
    .hero-title::after {
      content: "";

      width: 28px;
      height: 2px;

      flex-shrink: 0;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--blue-bright),
          var(--blue)
        );

      box-shadow:
        0 0 9px rgba(0,184,244,.4);
    }



    /* =====================================================
       CONTACT BUTTONS
    ===================================================== */


    .contact-actions {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 18px;
    }


    .contact-action {
      position: relative;

      min-width: 0;
      min-height: 102px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding:
        12px
        7px;

      text-align: center;

      border:
        1px solid rgba(96,197,239,.44);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(18,51,70,.94),
          rgba(3,17,25,.97)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 12px 27px rgba(0,0,0,.22);

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    .contact-action:active {
      transform:
        scale(.96);
    }


    .contact-action.primary {
      border-color:
        #38d0ff;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(96,222,255,.28),
          transparent 43%
        ),
        linear-gradient(
          145deg,
          #0da8df,
          #056798
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 8px 30px rgba(0,153,214,.22);
    }


    .contact-action.primary::before {
      content: "";

      position: absolute;

      top: -50%;
      left: -75%;

      width: 50%;
      height: 200%;

      transform:
        rotate(22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.13),
          transparent
        );

      animation:
        callShine
        5s
        ease-in-out
        infinite;
    }


    @keyframes callShine {
      0%,
      76% {
        left: -75%;
      }

      100% {
        left: 160%;
      }
    }


    .contact-icon {
      width: 29px;
      height: 29px;

      margin-bottom: 8px;

      color: var(--white);
    }


    .contact-icon svg {
      width: 100%;
      height: 100%;
    }


    .contact-label {
      color: var(--white);

      font-size: 13.5px;
      font-weight: 800;
    }


    .contact-sub {
      max-width: 110px;

      margin-top: 4px;

      overflow: hidden;

      color: #c6d9e1;

      font-size: 9px;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    .contact-action.primary
    .contact-sub {
      color: var(--white);

      font-size: 10.5px;
      font-weight: 700;

      font-variant-numeric:
        tabular-nums;
    }



    /* =====================================================
       CONTENT
    ===================================================== */


    .content {
      position: relative;

      z-index: 2;

      width: 100%;

      margin: 0;

      padding:
        0
        17px
        0;
    }



    /* =====================================================
       ADMISSIONS
    ===================================================== */


    .admissions {
      position: relative;

      min-height: 132px;

      overflow: hidden;

      display: flex;

      align-items: center;

      gap: 14px;

      padding: 18px;

      border:
        1px solid rgba(18,199,255,.95);

      border-radius: 20px;

      background:
        #072333;

      box-shadow:
        0 14px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.05);

      transition:
        transform .18s ease;
    }


    .admissions:active {
      transform:
        scale(.98);
    }


    .admissions::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: .32;

      background-image:
        linear-gradient(
          90deg,
          rgba(2,22,34,.96),
          rgba(3,32,48,.78)
        ),
        url("bridge-hero.webp");

      background-size: cover;

      background-position:
        center 46%;
    }


    .admissions > * {
      position: relative;

      z-index: 2;
    }


    .admissions-icon {
      position: relative;

      width: 62px;
      height: 62px;

      min-width: 62px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: var(--white);

      background:
        linear-gradient(
          145deg,
          #15b8ed,
          #08628f
        );

      box-shadow:
        0 8px 22px rgba(0,0,0,.24);
    }


    .admissions-icon::after {
      content: "";

      position: absolute;

      inset: -6px;

      border:
        1px solid rgba(91,209,255,.30);

      border-radius: 50%;

      animation:
        phonePulse
        2.8s
        ease-out
        infinite;
    }


    @keyframes phonePulse {
      0% {
        opacity: .75;

        transform:
          scale(.85);
      }

      75%,
      100% {
        opacity: 0;

        transform:
          scale(1.28);
      }
    }


    .admissions-icon svg {
      width: 30px;
      height: 30px;
    }


    .admissions-copy {
      flex: 1;

      min-width: 0;
    }


    .admissions-kicker {
      color: var(--blue-soft);

      font-size: 8px;
      font-weight: 800;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }


    .admissions-title {
      margin-top: 3px;

      font-size: 23px;
      font-weight: 800;

      line-height: 1;

      letter-spacing: -.7px;
    }


    .admissions-title span {
      color: var(--blue-bright);
    }


    .admissions-number {
      margin-top: 8px;

      color: var(--white);

      font-size: 21px;

<body>


<main
  id="app"
  class="page"
>


  <!-- IMMEDIATE FIRST-LOAD FULL PAGE SKELETON -->

  <section class="loading-shell">

        <img
          src="process-mark.png"

          </div>

<script>


/* =====================================================
   CONFIG
===================================================== */


const API_URL =
  'https://script.google.com/macros/s/AKfycbzefgAa3hJz9h2emDoa_4hhlxl99fIB_k_h5TEq1AIKmBXukcEx9llpglAsLqabXYOJ/exec';


const FALLBACK_WEBSITE =
  'https://www.theprocessrecoverycenter.com';


const LOAD_TIMEOUT_MS =
  12000;


const CACHE_MAX_AGE =
  6 * 60 * 60 * 1000;



/* =====================================================
   STAFF ID
===================================================== */


const params =
  new URLSearchParams(
    window.location.search
  );


const staffId =
  String(
    params.get('staff') ||
    ''
  )
    .toLowerCase()
    .trim();


const CACHE_KEY =
  'process-card-' +
  staffId;



let dataLoaded =
  false;


let loadTimeoutId =
  null;


let cachedData =
  null;


let cardRendered =
  false;



/* =====================================================
   LOCAL CACHE
===================================================== */


function getCachedCard() {

  if (!staffId) {
    return null;
  }


  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw) {
      return null;
    }


    const cached =
      JSON.parse(
        raw
      );


    if (
      !cached ||
      !cached.data ||
      !cached.savedAt
    ) {

      return null;

    }


    const age =
      Date.now() -
      cached.savedAt;


    if (
      age >
      CACHE_MAX_AGE
    ) {

      return null;

    }


    return cached.data;

  }

  catch (error) {

    return null;

  }

}



function saveCachedCard(
  data
) {

  if (
    !staffId ||
    !data ||
    !data.ok ||
    !data.staffFound
  ) {

    return;

  }


  try {

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify({

        savedAt:
          Date.now(),

        data:
          data

      })
    );

  }

  catch (error) {

    /* Cache failure does not affect card functionality. */

  }

}



/* =====================================================
   INITIAL CACHED RENDER
===================================================== */


cachedData =
  getCachedCard();


if (
  cachedData
) {

  renderPage(
    cachedData
  );

}



/* =====================================================
   JSONP CALLBACK
===================================================== */


window.processCardData =
  function(data) {

    dataLoaded =
      true;


    if (
      loadTimeoutId
    ) {

      clearTimeout(
        loadTimeoutId
      );


      loadTimeoutId =
        null;

    }


    saveCachedCard(
      data
    );


    /*
      If a cached card is already on screen
      and the fresh server response is identical,
      leave the page alone.

      This prevents a second render / visual jump.
    */

    if (
      cachedData &&
      sameData(
        cachedData,
        data
      )
    ) {

      cachedData =
        data;

      return;

    }


    cachedData =
      data;


    handleResponse(
      data
    );

  };



/* =====================================================
   COMPARE DATA
===================================================== */


function sameData(
  first,
  second
) {

  try {

    return (
      JSON.stringify(first) ===
      JSON.stringify(second)
    );

  }

  catch (error) {

    return false;

  }

}



/* =====================================================
   LOAD FROM APPS SCRIPT
===================================================== */


function loadData() {

  dataLoaded =
    false;


  if (
    loadTimeoutId
  ) {

    clearTimeout(
      loadTimeoutId
    );


    loadTimeoutId =
      null;

  }


  document
    .querySelectorAll(
      'script[data-card-api="true"]'
    )
    .forEach(
      script =>
        script.remove()
    );


  const script =
    document.createElement(
      'script'
    );


  script.dataset.cardApi =
    'true';


  /*
    IMPORTANT:

    No Date.now() cache-buster here anymore.

    That allows the browser/network layer
    to reuse the request when appropriate.
  */

  script.src =
    API_URL +
    '?staff=' +
    encodeURIComponent(
      staffId
    ) +
    '&callback=processCardData';


  script.onerror =
    renderNetworkError;


  document.body.appendChild(
    script
  );


  loadTimeoutId =
    setTimeout(
      renderTimeoutError,
      LOAD_TIMEOUT_MS
    );

}



/*
  We always check the server.

  If cache exists:
  cached card shows immediately,
  then fresh data updates silently.

  If no cache exists:
  branded skeleton stays visible
  until data arrives.
*/

loadData();



/* =====================================================
   RETRY
===================================================== */


function retryLoad() {

  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML =
    loadingShellHtml();


  loadData();

}



/* =====================================================
   API RESPONSE HANDLING
===================================================== */


function handleResponse(
  data
) {

  if (
    !data ||
    !data.ok
  ) {

    renderState({

      title:
        'Something Went Wrong',

      message:
        "We couldn't load this card. Please try again, or visit our website directly.",

      actionLabel:
        'Visit Website',

      actionHref:
        FALLBACK_WEBSITE,

      retry:
        true

    });


    return;

  }


  if (
    !data.requestedStaffId
  ) {

    renderState({

      title:
        'Welcome',

      message:
        "This link isn't tied to a specific team member yet. Visit our site to learn more or get in touch.",

      actionLabel:
        'Visit Website',

      actionHref:
        (
          data.settings &&
          data.settings.main_website
        ) ||
        FALLBACK_WEBSITE

    });


    return;

  }


  if (
    !data.staffFound
  ) {

    renderState({

      title:
        'Card Not Found',

      message:
        "We couldn't find this team member's card. It may have been updated — please visit our website.",

      actionLabel:
        'Visit Website',

      actionHref:
        (
          data.settings &&
          data.settings.main_website
        ) ||
        FALLBACK_WEBSITE

    });


    return;

  }


  renderPage(
    data
  );

}

function resolveResourceIcon(
  resource,
  nameLower
) {

  const explicit =
    String(
      resource.icon ||
      ''
    )
      .toLowerCase()
      .trim();


  if (
    explicit &&
    ICON_MAP[explicit]
  ) {

    return ICON_MAP[explicit]();

  }


  if (
    nameLower.includes(
      'respite'
    )
  ) {

    return iconHome();

  }


  if (
    nameLower.includes(
      'door'
    )
  ) {

    return iconDoor();

  }


  return iconPeople();

}

/* =====================================================
   RESOURCES
===================================================== */


function renderResource(
  resource
) {

  const name =
    String(
      resource.name ||
      ''
    );


  const nameLower =
    name.toLowerCase();


  const url =
    String(
      resource.url ||
      ''
    ).trim();


  const isPhone =
    url
      .toLowerCase()
      .startsWith(
        'tel:'
      );


  const icon =
    resolveResourceIcon(
      resource,
      nameLower
    );


  const displayNumber =
    resource.displayNumber ||
    resource.display_number ||
    '';


  let actionLabel =
    resource.actionLabel ||
    resource.action_label ||
    '';


  if (!actionLabel) {

    if (
      nameLower.includes(
        'respite'
      )
    ) {

      actionLabel =
        'Call Respite';

    }

    else if (
      nameLower.includes(
        'door'
      )
    ) {

      actionLabel =
        'Call Doorways';

    }

    else if (
      nameLower.includes(
        'alcoholics'
      ) ||
      nameLower.includes(
        'narcotics'
      )
    ) {

      actionLabel =
        'Find Meetings';

    }

    else if (
      isPhone
    ) {

      actionLabel =
        'Call Now';

    }

    else {

      actionLabel =
        'Visit Resource';

    }

  }


  return `


    <a
      class="resource-card reveal ${isPhone ? 'phone-resource' : ''}"
      href="${escapeAttribute(
        url ||
        '#'
      )}"
      aria-label="${escapeAttribute(
        actionLabel
      )}: ${escapeAttribute(
        name
      )}"
      ${
        isPhone
          ? ''
          : 'target="_blank" rel="noopener"'
      }
    >


      <div class="resource-icon">

        ${icon}

      </div>


      <div class="resource-name">

        ${escapeHtml(
          name
        )}

      </div>


      ${
        resource.description
          ? `

            <div class="resource-description">

              ${escapeHtml(
                resource.description
              )}

            </div>

          `
          : ''
      }


      <div class="resource-bottom">


        <div>


          ${
            displayNumber
              ? `

                <div class="resource-number">

                  ${escapeHtml(
                    displayNumber
                  )}

                </div>

              `
              : ''
          }


          <div class="resource-action-label">

            ${escapeHtml(
              actionLabel
            )}

          </div>


        </div>


        <div class="resource-arrow">

          ›

        </div>


      </div>


    </a>

  `;

}

/* =====================================================
   REVEAL ANIMATION
===================================================== */


function setupReveal() {

  const elements =
    document.querySelectorAll(
      '.reveal'
    );


  if (
    !(
      'IntersectionObserver'
      in
      window
    )
  ) {

    elements.forEach(
      element =>
        element
          .classList
          .add(
            'visible'
          )
    );


    return;

  }


  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(

          entry => {

            if (
              entry.isIntersecting
            ) {

              entry
                .target
                .classList
                .add(
                  'visible'
                );


              observer.unobserve(
                entry.target
              );

            }

          }

        );

      },

      {

        root:
          null,

        threshold:
          .04,

        rootMargin:
          '0px 0px 80px 0px'

      }

    );


  elements.forEach(
    element =>
      observer.observe(
        element
      )
  );

}

/* =====================================================
   ESCAPING
===================================================== */


function escapeHtml(
  value
) {

  return String(
    value ||
    ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#39;'
    );

}



function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}



/* =====================================================

===================================================== */


function renderState(
  options
) {

  /*
    If a valid cached card is already visible,
    never replace it with a temporary network error.
  */

  if (
    cardRendered &&
    options.retry
  ) {

    return;

  }


  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="state-wrap">


      <div class="state-card">


        <div class="state-icon">

          ${iconWarn()}

        <div class="state-title">

            options.title
          )}

        </div>


        <p class="state-message">

          ${escapeHtml(
            options.message
          )}

        </p>


        ${
          (
            options.actionHref ||
            options.retry
          )
            ? `

              <div class="state-action-row">


                ${
                  options.retry
                    ? `

                      <button
                        class="state-action"
                        type="button"
                        onclick="retryLoad()"

                    `
                    : ''

                    ? `

                      <a

/* =====================================================

===================================================== */


function renderNetworkError() {

  if (
    dataLoaded ||
    cardRendered
  ) {

    return;

  }


  if (
    loadTimeoutId
  ) {

    clearTimeout(
      loadTimeoutId
    );


    loadTimeoutId =
      null;

  }


  renderState({

    title:
      'Connection Issue',

    message:
      "We couldn't load this card. Check your connection and try again.",

    actionLabel:
      'Visit Website',

    actionHref:
      FALLBACK_WEBSITE,

    retry:
      true

  });

}



function renderTimeoutError() {

  if (
    dataLoaded ||
    cardRendered
  ) {

    return;

  }


  renderState({

    title:
      'Taking Longer Than Usual',

    message:
      "This is taking a while to load. Try again, or visit our website directly.",

    actionLabel:
      'Visit Website',

    actionHref:

      true

  });

}
