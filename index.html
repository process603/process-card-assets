<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#031019">

  <title>The Process Recovery Center</title>

  <style>

    :root {
      --blue: #59c7f2;
      --blue-bright: #00aeef;
      --blue-soft: #9eddf5;
      --navy: #061722;
      --navy-2: #0a2231;
      --navy-3: #102c3d;
      --white: #ffffff;
      --muted: #abc0cc;
      --border: rgba(102, 202, 241, .42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: #02090d;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(0, 174, 239, .13),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #06131b 0%,
          #02090d 70%
        );
    }

    a {
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      margin: 0 auto;

      background:
        linear-gradient(
          180deg,
          #06131b 0%,
          #031017 50%,
          #02090d 100%
        );

      overflow: hidden;

      box-shadow:
        0 0 70px rgba(0, 0, 0, .55);
    }



    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #b9c8cf;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 0 auto 14px;

      border-radius: 50%;

      border: 3px solid rgba(89, 199, 242, .18);
      border-top-color: var(--blue);

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }



    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;

      min-height: 430px;

      padding:
        max(18px, env(safe-area-inset-top))
        20px
        28px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      background-image:
        linear-gradient(
          180deg,
          rgba(2, 11, 17, .28) 0%,
          rgba(2, 12, 19, .25) 35%,
          rgba(2, 12, 19, .72) 72%,
          #06131b 100%
        ),
        url("bridge-hero.jpg");

      background-size: cover;

      background-position:
        center center;

      overflow: hidden;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 82% 24%,
          rgba(0, 174, 239, .10),
          transparent 38%
        );
    }

    .hero-top {
      position: absolute;

      top:
        max(
          18px,
          env(safe-area-inset-top)
        );

      left: 20px;
      right: 20px;

      z-index: 2;
    }

    .process-logo {
      display: block;

      width: 220px;
      max-width: 64%;

      filter:
        drop-shadow(
          0 5px 14px rgba(0, 0, 0, .45)
        );
    }

    .hero-content {
      position: relative;

      z-index: 3;

      margin-top: 170px;
    }

    .hero-name {
      margin: 0;

      font-size:
        clamp(
          34px,
          8.8vw,
          46px
        );

      line-height: 1.02;

      font-weight: 800;

      letter-spacing: -.9px;

      text-shadow:
        0 4px 16px rgba(0,0,0,.7);
    }

    .hero-title {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 10px;

      color: #d9e8ef;

      font-size: 16px;

      line-height: 1.3;

      text-shadow:
        0 2px 10px rgba(0,0,0,.8);
    }

    .hero-title::before,
    .hero-title::after {
      content: "";

      height: 2px;

      width: 27px;

      flex-shrink: 0;

      background:
        var(--blue-bright);
    }

    .credentials {
      margin-top: 5px;

      color: var(--blue-soft);

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 1.2px;

      text-transform: uppercase;
    }



    /* =====================================================
       CONTACT ACTIONS
    ===================================================== */

    .contact-actions {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 9px;

      margin-top: 19px;
    }

    .contact-action {
      min-height: 94px;

      padding:
        13px
        8px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      border:
        1px
        solid
        rgba(107, 200, 239, .45);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(16, 44, 61, .93),
          rgba(5, 21, 31, .95)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 9px 24px rgba(0,0,0,.18);

      transition:
        transform .12s ease,
        border-color .12s ease;
    }

    .contact-action:active {
      transform: scale(.97);

      border-color:
        var(--blue);
    }

    .contact-action.primary {
      background:
        linear-gradient(
          145deg,
          #0c9dd7,
          #086ca5
        );

      border-color:
        #26c5ff;
    }

    .contact-icon {
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 7px;

      font-size: 23px;
    }

    .contact-label {
      font-size: 14px;

      font-weight: 800;
    }

    .contact-sub {
      margin-top: 4px;

      max-width: 110px;

      overflow: hidden;

      color: #c2d4dc;

      font-size: 9.5px;

      text-overflow: ellipsis;

      white-space: nowrap;
    }



    /* =====================================================
       CONTENT
    ===================================================== */

    .content {
      padding:
        0
        17px
        36px;
    }



    /* =====================================================
       ADMISSIONS
    ===================================================== */

    .admissions {
      position: relative;

      overflow: hidden;

      min-height: 127px;

      display: flex;

      align-items: center;

      gap: 15px;

      padding:
        19px
        19px;

      border:
        1px
        solid
        #0ebdff;

      border-radius: 19px;

      background:
        linear-gradient(
          90deg,
          rgba(5, 31, 46, .98),
          rgba(6, 38, 58, .91)
        );

      box-shadow:
        0 10px 28px rgba(0,0,0,.24),
        inset 0 0 30px rgba(0,174,239,.05);
    }

    .admissions::after {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          90deg,
          rgba(4, 21, 31, .96),
          rgba(4, 28, 43, .75)
        ),
        url("bridge-hero.jpg");

      background-size: cover;
      background-position: center 58%;

      opacity: .42;

      z-index: 0;
    }

    .admissions > * {
      position: relative;

      z-index: 2;
    }

    .admissions-icon {
      width: 61px;
      height: 61px;

      min-width: 61px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #0ca4de,
          #075a91
        );

      font-size: 28px;
    }

    .admissions-copy {
      flex: 1;
    }

    .admissions-title {
      font-size: 25px;

      font-weight: 900;

      letter-spacing: -.3px;
    }

    .admissions-title span {
      color:
        var(--blue-bright);
    }

    .admissions-number {
      margin-top: 7px;

      color: white;

      font-size: 18px;

      font-weight: 800;
    }

    .admissions-sub {
      margin-top: 7px;

      color:
        var(--blue-soft);

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 1.4px;

      text-transform: uppercase;
    }

    .admissions-arrow {
      font-size: 34px;

      color: white;
    }



    /* =====================================================
       WEBSITE + DIRECTIONS
    ===================================================== */

    .primary-links {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 9px;

      margin-top: 11px;
    }

    .primary-link {
      min-height: 102px;

      display: flex;

      align-items: center;

      gap: 11px;

      padding: 15px;

      border:
        1px
        solid
        rgba(105, 188, 224, .36);

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #102838,
          #071722
        );

      transition:
        transform .12s ease;
    }

    .primary-link:active {
      transform: scale(.98);
    }

    .link-icon {
      width: 38px;

      min-width: 38px;

      text-align: center;

      font-size: 28px;
    }

    .link-copy {
      flex: 1;

      min-width: 0;
    }

    .link-title {
      font-size: 13px;

      font-weight: 800;
    }

    .link-sub {
      overflow: hidden;

      margin-top: 5px;

      color:
        var(--muted);

      font-size: 9.5px;

      line-height: 1.35;

      text-overflow: ellipsis;
    }

    .link-arrow {
      color: white;

      font-size: 24px;
    }



    /* =====================================================
       SECTION TITLE
    ===================================================== */

    .section-heading {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 12px;

      margin:
        29px
        4px
        13px;

      padding-bottom: 8px;

      border-bottom:
        2px
        solid
        rgba(0, 174, 239, .72);
    }

    .section-title {
      color:
        var(--blue-soft);

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 2.7px;

      text-transform: uppercase;
    }

    .section-small {
      color:
        #7ccbe9;

      font-size: 7px;

      font-weight: 700;

      line-height: 1.4;

      letter-spacing: 1.5px;

      text-align: right;

      text-transform: uppercase;
    }



    /* =====================================================
       RESOURCES
    ===================================================== */

    .resource-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 9px;
    }

    .resource-card {
      position: relative;

      min-height: 164px;

      display: flex;

      flex-direction: column;

      padding:
        16px
        14px;

      border:
        1px
        solid
        rgba(100, 190, 229, .42);

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #112b3c,
          #071723
        );

      overflow: hidden;

      transition:
        transform .12s ease;
    }

    .resource-card:active {
      transform: scale(.98);
    }

    .resource-icon {
      height: 37px;

      display: flex;

      align-items: center;

      margin-bottom: 11px;

      color: white;

      font-size: 30px;
    }

    .resource-name {
      min-height: 34px;

      color: white;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.2;
    }

    .resource-description {
      margin-top: 6px;

      color: #9bb4c0;

      font-size: 9.5px;

      line-height: 1.35;
    }

    .resource-bottom {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 8px;

      margin-top: auto;

      padding-top: 13px;
    }

    .resource-number {
      color:
        #dcebf1;

      font-size: 12px;

      font-weight: 700;
    }

    .resource-action-label {
      margin-top: 4px;

      color:
        var(--blue);

      font-size: 8.5px;

      font-weight: 800;

      text-transform: uppercase;
    }

    .resource-arrow {
      color: white;

      font-size: 24px;
    }



    /* =====================================================
       CRISIS
    ===================================================== */

    .crisis {
      position: relative;

      overflow: hidden;

      margin-top: 15px;

      min-height: 138px;

      display: flex;

      align-items: center;

      gap: 15px;

      padding:
        18px;

      border:
        1px
        solid
        #0dbdff;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #062033,
          #07141e
        );
    }

    .crisis-number-block {
      display: flex;

      align-items: center;

      gap: 10px;

      flex-shrink: 0;
    }

    .crisis-icon {
      width: 50px;
      height: 50px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #167aaf,
          #0b3857
        );

      font-size: 24px;
    }

    .crisis-number {
      font-size: 42px;

      font-weight: 900;

      line-height: 1;
    }

    .crisis-divider {
      width: 1px;

      align-self: stretch;

      background:
        var(--blue-bright);
    }

    .crisis-copy {
      flex: 1;
    }

    .crisis-title {
      font-size: 14px;

      font-weight: 900;

      line-height: 1.25;
    }

    .crisis-actions {
      display: flex;

      gap: 7px;

      margin-top: 9px;
    }

    .crisis-action {
      color:
        var(--blue-soft);

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1.3px;

      text-transform: uppercase;
    }

    .crisis-support {
      margin-top: 11px;

      color:
        var(--blue-bright);

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }

    .emergency {
      display: block;

      margin-top: 8px;

      color: #758c98;

      font-size: 8.5px;

      text-align: center;
    }



    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      padding:
        34px
        15px
        10px;

      text-align: center;
    }

    .footer-brand-row {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 16px;
    }

    .footer-line {
      width: 72px;
      height: 1px;

      background:
        var(--blue-bright);
    }

    .footer-mark {
      width: 52px;
      height: 52px;

      object-fit: contain;
    }

    .footer-company {
      margin-top: 11px;

      color: #a9c8d6;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .king-logo {
      display: block;

      width: 100px;
      max-height: 70px;

      margin:
        17px auto
        0;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);

      opacity: .72;
    }

    .footer-tagline {
      margin-top: 22px;

      color:
        var(--blue-bright);

      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 31px;

      line-height: 1;

      transform: rotate(-1deg);
    }

    .footer-accent {
      width: 45px;
      height: 3px;

      margin:
        15px auto
        0;

      border-radius: 999px;

      background:
        var(--blue-bright);
    }



    /* =====================================================
       ERROR
    ===================================================== */

    .error-card {
      margin: 40px 18px;

      padding: 24px;

      border-radius: 18px;

      background: white;

      color: #111;
    }



    /* =====================================================
       MOBILE SMALL
    ===================================================== */

    @media (max-width: 360px) {

      .hero {
        min-height: 400px;
      }

      .hero-name {
        font-size: 31px;
      }

      .contact-actions {
        gap: 6px;
      }

      .contact-action {
        padding:
          11px
          5px;
      }

      .contact-label {
        font-size: 12px;
      }

      .contact-sub {
        font-size: 8px;
      }

      .admissions-title {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>

  <main
    id="app"
    class="page"
  >

    <div class="loading">

      <div>

        <div class="spinner"></div>

        Loading...

      </div>

    </div>

  </main>



<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzefgAa3hJz9h2emDoa_4hhlxl99fIB_k_h5TEq1AIKmBXukcEx9llpglAsLqabXYOJ/exec';


const params =
  new URLSearchParams(
    window.location.search
  );


const staffId =
  String(
    params.get('staff') || ''
  )
    .toLowerCase()
    .trim();



/* =====================================================
   API CALLBACK
===================================================== */

window.processCardData =
  function(data) {

    renderPage(data);

  };



/* =====================================================
   LOAD
===================================================== */

function loadData() {

  const script =
    document.createElement(
      'script'
    );


  script.src =
    API_URL +
    '?staff=' +
    encodeURIComponent(
      staffId
    ) +
    '&callback=processCardData' +
    '&t=' +
    Date.now();


  script.onerror =
    renderError;


  document.body.appendChild(
    script
  );

}


loadData();



/* =====================================================
   RENDER
===================================================== */

function renderPage(data) {

  const app =
    document.getElementById(
      'app'
    );


  const staff =
    data.staff || null;


  const settings =
    data.settings || {};


  const resources =
    data.resources || [];


  if (!staff) {

    renderError();

    return;

  }


  document.title =
    staff.name +
    ' | The Process Recovery Center';



  /* ===================================================
     RESOURCES
  =================================================== */

  const crisisResource =
    resources.find(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() === 'crisis'
    );


  const visibleResources =
    resources.filter(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() !== 'crisis'
    );



  /* ===================================================
     PAGE
  =================================================== */

  let html = `


    <section class="hero">


      <div class="hero-top">

        <img
          class="process-logo"
          src="${escapeAttribute(settings.process_logo)}"
          alt="The Process Recovery Center"
        >

      </div>


      <div class="hero-content">


        <h1 class="hero-name">

          ${escapeHtml(staff.name)}

        </h1>


        ${
          staff.title
            ? `

              <div class="hero-title">

                ${escapeHtml(staff.title)}

              </div>

            `
            : ''
        }


        ${
          staff.credentials
            ? `

              <div class="credentials">

                ${escapeHtml(staff.credentials)}

              </div>

            `
            : ''
        }


        <div class="contact-actions">


          <a
            class="contact-action primary"
            href="${escapeAttribute(staff.phoneHref)}"
          >

            <div class="contact-icon">
              ☎
            </div>

            <div class="contact-label">
              Call
            </div>

            <div class="contact-sub">
              ${escapeHtml(staff.phone)}
            </div>

          </a>


          <a
            class="contact-action"
            href="mailto:${escapeAttribute(staff.email)}"
          >

            <div class="contact-icon">
              ✉
            </div>

            <div class="contact-label">
              Email
            </div>

            <div class="contact-sub">
              Send a Message
            </div>

          </a>


          <a
            class="contact-action"
            href="${API_URL}?staff=${encodeURIComponent(staff.id)}&vcard=1"
          >

            <div class="contact-icon">
              +
            </div>

            <div class="contact-label">
              Save Contact
            </div>

            <div class="contact-sub">
              Add to Phone
            </div>

          </a>


        </div>


      </div>


    </section>



    <section class="content">


      <a
        class="admissions"
        href="${escapeAttribute(settings.admissionsHref)}"
      >

        <div class="admissions-icon">
          ☎
        </div>


        <div class="admissions-copy">

          <div class="admissions-title">

            ADMISSIONS
            <span>24/7</span>

          </div>

          <div class="admissions-number">

            ${escapeHtml(settings.admissions_phone)}

          </div>

          <div class="admissions-sub">

            Real people. Real help. Any time.

          </div>

        </div>


        <div class="admissions-arrow">

          ›

        </div>


      </a>



      <div class="primary-links">


        <a
          class="primary-link"
          href="${escapeAttribute(settings.main_website)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ◎
          </div>

          <div class="link-copy">

            <div class="link-title">
              Visit Process Website
            </div>

            <div class="link-sub">
              theprocessrecoverycenter.com
            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>


        <a
          class="primary-link"
          href="${escapeAttribute(settings.mapsHref)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ⌖
          </div>

          <div class="link-copy">

            <div class="link-title">
              Get Directions
            </div>

            <div class="link-sub">
              ${escapeHtml(settings.main_address)}
            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>


      </div>



      <div class="section-heading">

        <div class="section-title">
          Recovery Resources
        </div>

        <div class="section-small">
          Community<br>
          Support<br>
          Long-Term Change
        </div>

      </div>



      <div class="resource-grid">

        ${
          visibleResources
            .map(
              resource =>
                renderResource(
                  resource
                )
            )
            .join('')
        }

      </div>



      ${renderCrisis(crisisResource)}



      <footer class="footer">


        <div class="footer-brand-row">

          <div class="footer-line"></div>

          <img
            class="footer-mark"
            src="${escapeAttribute(settings.process_logo)}"
            alt=""
          >

          <div class="footer-line"></div>

        </div>


        <div class="footer-company">

          The Process Recovery Center

        </div>


        ${
          settings.king_logo
            ? `

              <img
                class="king-logo"
                src="${escapeAttribute(settings.king_logo)}"
                alt="King Healthcare Group"
              >

            `
            : ''
        }


        <div class="footer-company">

          New England Area and Beyond

        </div>


        <div class="footer-tagline">

          Recovery Starts Here.

        </div>


        <div class="footer-accent"></div>


      </footer>


    </section>

  `;


  app.innerHTML =
    html;

}



/* =====================================================
   RESOURCE CARD
===================================================== */

function renderResource(
  resource
) {

  const name =
    String(
      resource.name || ''
    );


  const nameLower =
    name.toLowerCase();


  let icon =
    '◆';


  if (
    nameLower.includes(
      'respite'
    )
  ) {

    icon =
      '⌂';

  }

  else if (
    nameLower.includes(
      'door'
    )
  ) {

    icon =
      '🚪';

  }

  else if (
    nameLower.includes(
      'alcoholics'
    ) ||
    nameLower.includes(
      'narcotics'
    )
  ) {

    icon =
      '●●●';

  }


  const displayNumber =
    resource.displayNumber ||
    resource.display_number ||
    '';


  const actionLabel =
    resource.actionLabel ||
    resource.action_label ||
    'Open Resource';


  const isPhone =
    String(
      resource.url || ''
    )
      .toLowerCase()
      .startsWith(
        'tel:'
      );


  return `

    <a
      class="resource-card"
      href="${escapeAttribute(resource.url || '#')}"
      ${isPhone ? '' : 'target="_blank" rel="noopener"'}
    >

      <div class="resource-icon">

        ${icon}

      </div>


      <div class="resource-name">

        ${escapeHtml(name)}

      </div>


      <div class="resource-description">

        ${escapeHtml(resource.description || '')}

      </div>


      <div class="resource-bottom">


        <div>

          ${
            displayNumber
              ? `

                <div class="resource-number">

                  ${escapeHtml(displayNumber)}

                </div>

              `
              : ''
          }


          <div class="resource-action-label">

            ${escapeHtml(actionLabel)}

          </div>

        </div>


        <div class="resource-arrow">

          ›

        </div>


      </div>


    </a>

  `;

}



/* =====================================================
   CRISIS
===================================================== */

function renderCrisis(
  crisis
) {

  const displayNumber =
    crisis &&
    (
      crisis.displayNumber ||
      crisis.display_number
    )
      ? (
          crisis.displayNumber ||
          crisis.display_number
        )
      : '988';


  const callUrl =
    crisis &&
    crisis.url
      ? crisis.url
      : 'tel:988';


  return `

    <div class="crisis">


      <div class="crisis-number-block">

        <div class="crisis-icon">

          ☎

        </div>

        <div class="crisis-number">

          ${escapeHtml(displayNumber)}

        </div>

      </div>


      <div class="crisis-divider"></div>


      <div class="crisis-copy">

        <div class="crisis-title">

          Mental Health Crisis Lifeline

        </div>


        <div class="crisis-actions">

          <a
            class="crisis-action"
            href="${escapeAttribute(callUrl)}"
          >
            Call
          </a>

          <span class="crisis-action">
            |
          </span>

          <a
            class="crisis-action"
            href="sms:988"
          >
            Text
          </a>

        </div>


        <div class="crisis-support">

          Support is available 24/7.

        </div>

      </div>


    </div>


    <a
      class="emergency"
      href="tel:911"
    >

      Immediate emergency? Call 911

    </a>

  `;

}



/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#39;'
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}



/* =====================================================
   ERROR
===================================================== */

function renderError() {

  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="error-card">

      <h2>
        Unable to load
      </h2>

      <p>
        Please refresh the page or visit
        The Process Recovery Center website.
      </p>

    </div>

  `;

}
