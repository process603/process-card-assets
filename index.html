<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#031019">

  <title>The Process Recovery Center</title>

  <style>
    :root {
      --blue: #56c8f2;
      --blue-bright: #00aeef;
      --blue-soft: #a8e1f7;

      --bg: #02090d;
      --bg-2: #04111a;
      --panel: #0b2230;
      --panel-2: #102d3f;

      --white: #ffffff;
      --muted: #9eb3be;

      --border: rgba(76, 191, 236, .42);
      --border-soft: rgba(112, 197, 232, .24);
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 10% 12%,
          rgba(0,174,239,.14),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #06131b 0%,
          #02090d 100%
        );
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    svg {
      display: block;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      margin: 0 auto;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #06131b 0%,
          #031017 50%,
          #02090d 100%
        );

      box-shadow:
        0 0 70px rgba(0,0,0,.55);
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #bac9d0;
      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 0 auto 14px;

      border-radius: 50%;

      border:
        3px solid rgba(89,199,242,.18);

      border-top-color:
        var(--blue);

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;

      min-height: 490px;

      padding:
        max(18px, env(safe-area-inset-top))
        20px
        24px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      overflow: hidden;

      background-image:
        linear-gradient(
          180deg,
          rgba(2,10,16,.16) 0%,
          rgba(2,10,16,.20) 30%,
          rgba(2,11,17,.46) 57%,
          rgba(2,12,18,.82) 81%,
          #06131b 100%
        ),
        url("bridge-hero.jpg");

      background-size: cover;
      background-position: center 45%;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 78% 24%,
          rgba(0,174,239,.10),
          transparent 40%
        );
    }

    .hero-top {
      position: absolute;

      top:
        max(
          18px,
          env(safe-area-inset-top)
        );

      left: 19px;

      z-index: 3;
    }

    .logo-glass {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding:
        10px
        14px;

      border:
        1px solid rgba(255,255,255,.30);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.91),
          rgba(242,248,250,.84)
        );

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      box-shadow:
        0 10px 28px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.72);
    }

    .process-logo {
      display: block;

      width: 215px;
      max-width: 66vw;
      max-height: 82px;

      object-fit: contain;
    }

    .hero-content {
      position: relative;

      z-index: 3;

      margin-top: 175px;
    }

    .hero-name {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          38px,
          9.5vw,
          49px
        );

      line-height: .98;

      font-weight: 700;

      letter-spacing: -.8px;

      text-shadow:
        0 4px 18px rgba(0,0,0,.76);
    }

    .hero-title {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 11px;

      color: #e4edf1;

      font-size: 16px;

      line-height: 1.3;

      font-weight: 500;

      text-shadow:
        0 2px 12px rgba(0,0,0,.8);
    }

    .hero-title::before,
    .hero-title::after {
      content: "";

      width: 27px;
      height: 2px;

      flex-shrink: 0;

      border-radius: 999px;

      background:
        var(--blue-bright);
    }

    .credentials {
      margin-top: 8px;

      color:
        #c4e9f8;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 1.1px;

      text-transform: uppercase;
    }


    /* =====================================================
       CONTACT ACTIONS
    ===================================================== */

    .contact-actions {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 18px;
    }

    .contact-action {
      min-height: 96px;

      padding:
        12px
        7px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      border:
        1px solid rgba(90,194,235,.45);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(17,48,66,.94),
          rgba(4,18,27,.97)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 25px rgba(0,0,0,.2);

      transition:
        transform .12s ease,
        border-color .12s ease;
    }

    .contact-action.primary {
      background:
        linear-gradient(
          145deg,
          #0ca5df,
          #0669a0
        );

      border-color:
        #32caff;
    }

    .contact-action:active {
      transform:
        scale(.97);
    }

    .contact-icon {
      width: 27px;
      height: 27px;

      margin-bottom: 8px;

      color: white;
    }

    .contact-icon svg {
      width: 100%;
      height: 100%;
    }

    .contact-label {
      font-size: 14px;
      font-weight: 800;
    }

    .contact-sub {
      margin-top: 4px;

      max-width: 110px;

      overflow: hidden;

      color: #c3d3da;

      font-size: 9.5px;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    /* =====================================================
       CONTENT
    ===================================================== */

    .content {
      padding:
        0
        17px
        10px;
    }


    /* =====================================================
       ADMISSIONS
    ===================================================== */

    .admissions {
      position: relative;

      overflow: hidden;

      min-height: 124px;

      display: flex;
      align-items: center;

      gap: 15px;

      padding:
        18px;

      border:
        1px solid #0ebdff;

      border-radius: 19px;

      background:
        linear-gradient(
          90deg,
          #062233,
          #0a3047
        );

      box-shadow:
        0 12px 28px rgba(0,0,0,.26),
        inset 0 0 34px rgba(0,174,239,.05);
    }

    .admissions::after {
      content: "";

      position: absolute;
      inset: 0;

      opacity: .22;

      background-image:
        linear-gradient(
          90deg,
          rgba(3,18,27,.95),
          rgba(4,34,50,.62)
        ),
        url("bridge-hero.jpg");

      background-size: cover;
      background-position: center 48%;

      z-index: 0;
    }

    .admissions > * {
      position: relative;
      z-index: 2;
    }

    .admissions-icon {
      width: 60px;
      height: 60px;

      min-width: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #13aae4,
          #075889
        );

      box-shadow:
        0 7px 20px rgba(0,0,0,.22);
    }

    .admissions-icon svg {
      width: 30px;
      height: 30px;
    }

    .admissions-copy {
      min-width: 0;
      flex: 1;
    }

    .admissions-title {
      font-size: 25px;

      font-weight: 900;

      letter-spacing: -.4px;
    }

    .admissions-title span {
      color:
        var(--blue-bright);
    }

    .admissions-number {
      margin-top: 5px;

      color: white;

      font-size: 18px;

      font-weight: 850;
    }

    .admissions-sub {
      margin-top: 7px;

      color:
        var(--blue-soft);

      font-size: 8.5px;

      font-weight: 800;

      letter-spacing: 1.4px;

      text-transform: uppercase;
    }

    .admissions-arrow {
      color: white;

      font-size: 32px;
    }


    /* =====================================================
       WEBSITE + DIRECTIONS
    ===================================================== */

    .primary-links {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 11px;
    }

    .primary-link {
      min-height: 106px;

      display: flex;
      align-items: center;

      gap: 10px;

      padding:
        15px;

      border:
        1px solid rgba(105,188,224,.36);

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #102a3b,
          #071620
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);

      transition:
        transform .12s ease;
    }

    .primary-link:active {
      transform:
        scale(.98);
    }

    .link-icon {
      width: 34px;
      height: 34px;

      min-width: 34px;

      color: white;
    }

    .link-icon svg {
      width: 100%;
      height: 100%;
    }

    .link-copy {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 13px;

      font-weight: 850;

      line-height: 1.18;
    }

    .link-sub {
      margin-top: 5px;

      overflow: hidden;

      color:
        var(--muted);

      font-size: 9.5px;

      line-height: 1.35;

      text-overflow: ellipsis;
    }

    .link-arrow {
      color: white;

      font-size: 24px;
    }


    /* =====================================================
       SECTION HEADER
    ===================================================== */

    .section-heading {
      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      gap: 12px;

      margin:
        29px
        4px
        13px;

      padding-bottom: 8px;

      border-bottom:
        2px solid rgba(0,174,239,.72);
    }

    .section-title {
      color:
        var(--blue-soft);

      font-size: 16px;

      font-weight: 850;

      letter-spacing: 2.6px;

      text-transform: uppercase;
    }

    .section-small {
      color: #7ccbe9;

      font-size: 7px;

      font-weight: 750;

      line-height: 1.4;

      letter-spacing: 1.45px;

      text-align: right;

      text-transform: uppercase;
    }


    /* =====================================================
       RESOURCES
    ===================================================== */

    .resource-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;
    }

    .resource-card {
      min-height: 165px;

      padding:
        16px
        14px;

      display: flex;
      flex-direction: column;

      border:
        1px solid rgba(100,190,229,.42);

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #112b3c,
          #071723
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);

      transition:
        transform .12s ease;
    }

    .resource-card:active {
      transform:
        scale(.98);
    }

    .resource-icon {
      width: 36px;
      height: 36px;

      margin-bottom: 11px;

      color:
        #dff5ff;
    }

    .resource-icon svg {
      width: 100%;
      height: 100%;
    }

    .resource-name {
      min-height: 34px;

      color: white;

      font-size: 14px;

      font-weight: 850;

      line-height: 1.2;
    }

    .resource-description {
      margin-top: 6px;

      color: #9fb4bf;

      font-size: 9.5px;

      line-height: 1.35;
    }

    .resource-bottom {
      margin-top: auto;
      padding-top: 12px;

      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      gap: 8px;
    }

    .resource-number {
      color: #dcebf1;

      font-size: 12px;

      font-weight: 750;
    }

    .resource-action-label {
      margin-top: 4px;

      color:
        var(--blue);

      font-size: 8.5px;

      font-weight: 850;

      text-transform: uppercase;
    }

    .resource-arrow {
      color: white;

      font-size: 24px;
    }


    /* =====================================================
       CRISIS
    ===================================================== */

    .crisis {
      margin-top: 15px;

      min-height: 138px;

      padding:
        18px;

      display: flex;
      align-items: center;

      gap: 15px;

      border:
        1px solid #0dbdff;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #062033,
          #07141e
        );

      box-shadow:
        inset 0 0 30px rgba(0,174,239,.035);
    }

    .crisis-number-block {
      display: flex;
      align-items: center;

      gap: 10px;

      flex-shrink: 0;
    }

    .crisis-icon {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #167eaf,
          #0b3958
        );
    }

    .crisis-icon svg {
      width: 24px;
      height: 24px;
    }

    .crisis-number {
      font-size: 42px;

      font-weight: 900;

      line-height: 1;
    }

    .crisis-divider {
      width: 1px;

      align-self: stretch;

      background:
        var(--blue-bright);
    }

    .crisis-copy {
      flex: 1;
    }

    .crisis-title {
      font-size: 14px;

      font-weight: 900;

      line-height: 1.25;
    }

    .crisis-actions {
      display: flex;

      gap: 7px;

      margin-top: 9px;
    }

    .crisis-action {
      color:
        var(--blue-soft);

      font-size: 9px;

      font-weight: 850;

      letter-spacing: 1.25px;

      text-transform: uppercase;
    }

    .crisis-support {
      margin-top: 11px;

      color:
        var(--blue-bright);

      font-size: 9px;

      font-weight: 850;

      letter-spacing: 1.55px;

      text-transform: uppercase;
    }

    .emergency {
      display: block;

      margin-top: 9px;

      color: #758c98;

      font-size: 8.5px;

      text-align: center;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      padding:
        28px
        12px
        8px;

      text-align: center;
    }

    .footer-divider {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 13px;
    }

    .footer-line {
      width: 76px;
      height: 1px;

      background:
        var(--blue-bright);
    }

    .footer-symbol {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,174,239,.15),
          transparent 72%
        );
    }

    .footer-symbol img {
      width: 44px;
      height: 44px;

      object-fit: contain;
    }

    .footer-process-text {
      margin-top: 10px;

      color: #b6d4e0;

      font-size: 8.5px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .king-wrap {
      width: 142px;

      margin:
        15px auto
        0;

      padding:
        9px
        11px;

      border:
        1px solid rgba(255,255,255,.28);

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.92),
          rgba(241,247,249,.85)
        );

      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);

      box-shadow:
        0 10px 24px rgba(0,0,0,.16),
        inset 0 1px 0 rgba(255,255,255,.72);
    }

    .king-logo {
      display: block;

      width: 100%;
      max-height: 68px;

      object-fit: contain;

      opacity: .98;

      filter: none;
    }

    .footer-region {
      margin-top: 14px;

      color: #a7c9d7;

      font-size: 8.5px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .footer-tagline {
      margin-top: 18px;

      color:
        var(--blue-bright);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      font-style: italic;

      line-height: 1.1;
    }

    .footer-accent {
      width: 46px;
      height: 3px;

      margin:
        12px auto
        0;

      border-radius: 999px;

      background:
        var(--blue-bright);
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error-card {
      margin:
        40px
        18px;

      padding: 24px;

      border-radius: 18px;

      background: white;

      color: #111;
    }


    @media (max-width: 360px) {
      .hero {
        min-height: 462px;
      }

      .hero-name {
        font-size: 34px;
      }

      .contact-actions {
        gap: 6px;
      }

      .contact-action {
        min-height: 92px;
      }

      .contact-label {
        font-size: 12px;
      }

      .contact-sub {
        font-size: 8px;
      }

      .admissions-title {
        font-size: 21px;
      }
    }
  </style>
</head>


<body>

  <main id="app" class="page">

    <div class="loading">
      <div>
        <div class="spinner"></div>
        Loading...
      </div>
    </div>

  </main>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzefgAa3hJz9h2emDoa_4hhlxl99fIB_k_h5TEq1AIKmBXukcEx9llpglAsLqabXYOJ/exec';


const params =
  new URLSearchParams(
    window.location.search
  );


const staffId =
  String(
    params.get('staff') || ''
  )
    .toLowerCase()
    .trim();


window.processCardData =
  function(data) {
    renderPage(data);
  };


function loadData() {

  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?staff=' +
    encodeURIComponent(staffId) +
    '&callback=processCardData' +
    '&t=' +
    Date.now();


  script.onerror =
    renderError;


  document.body.appendChild(
    script
  );

}


loadData();


function iconPhone() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
    </svg>
  `;
}


function iconMail() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
  `;
}


function iconContact() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M19 8v6"></path>
      <path d="M22 11h-6"></path>
    </svg>
  `;
}


function iconGlobe() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18"></path>
      <path d="M12 3a14 14 0 0 1 0 18"></path>
      <path d="M12 3a14 14 0 0 0 0 18"></path>
    </svg>
  `;
}


function iconPin() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"></path>
      <circle cx="12" cy="10" r="2.5"></circle>
    </svg>
  `;
}


function iconHome() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 11 12 3l9 8"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  `;
}


function iconDoor() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 21h14"></path>
      <path d="M7 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17"></path>
      <circle cx="14" cy="12" r=".7" fill="currentColor"></circle>
    </svg>
  `;
}


function iconPeople() {
  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="8" cy="8" r="3"></circle>
      <circle cx="16" cy="8" r="3"></circle>
      <path d="M2 20c0-3 2.5-6 6-6s6 3 6 6"></path>
      <path d="M10 20c0-3 2.5-6 6-6s6 3 6 6"></path>
    </svg>
  `;
}


function renderPage(data) {

  const app =
    document.getElementById('app');


  const staff =
    data.staff || null;


  const settings =
    data.settings || {};


  const resources =
    data.resources || [];


  if (!staff) {
    renderError();
    return;
  }


  document.title =
    staff.name +
    ' | The Process Recovery Center';


  const crisisResource =
    resources.find(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() ===
        'crisis'
    );


  const visibleResources =
    resources.filter(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() !==
        'crisis'
    );


  let html = `

    <section class="hero">


      <div class="hero-top">

        <div class="logo-glass">

          <img
            class="process-logo"
            src="${escapeAttribute(settings.process_logo)}"
            alt="The Process Recovery Center"
          >

        </div>

      </div>


      <div class="hero-content">


        <h1 class="hero-name">
          ${escapeHtml(staff.name)}
        </h1>


        ${
          staff.title
            ? `
              <div class="hero-title">
                ${escapeHtml(staff.title)}
              </div>
            `
            : ''
        }


        ${
          staff.credentials
            ? `
              <div class="credentials">
                ${escapeHtml(staff.credentials)}
              </div>
            `
            : ''
        }


        <div class="contact-actions">


          <a
            class="contact-action primary"
            href="${escapeAttribute(staff.phoneHref)}"
          >

            <div class="contact-icon">
              ${iconPhone()}
            </div>

            <div class="contact-label">
              Call
            </div>

            <div class="contact-sub">
              ${escapeHtml(staff.phone)}
            </div>

          </a>


          <a
            class="contact-action"
            href="mailto:${escapeAttribute(staff.email)}"
          >

            <div class="contact-icon">
              ${iconMail()}
            </div>

            <div class="contact-label">
              Email
            </div>

            <div class="contact-sub">
              Send a Message
            </div>

          </a>


          <a
            class="contact-action"
            href="${API_URL}?staff=${encodeURIComponent(staff.id)}&vcard=1"
          >

            <div class="contact-icon">
              ${iconContact()}
            </div>

            <div class="contact-label">
              Save Contact
            </div>

            <div class="contact-sub">
              Add to Phone
            </div>

          </a>


        </div>


      </div>


    </section>


    <section class="content">


      <a
        class="admissions"
        href="${escapeAttribute(settings.admissionsHref)}"
      >

        <div class="admissions-icon">
          ${iconPhone()}
        </div>


        <div class="admissions-copy">

          <div class="admissions-title">

            ADMISSIONS
            <span>24/7</span>

          </div>


          <div class="admissions-number">
            ${escapeHtml(settings.admissions_phone)}
          </div>


          <div class="admissions-sub">
            Real people. Real help. Any time.
          </div>

        </div>


        <div class="admissions-arrow">
          ›
        </div>

      </a>


      <div class="primary-links">


        <a
          class="primary-link"
          href="${escapeAttribute(settings.main_website)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ${iconGlobe()}
          </div>


          <div class="link-copy">

            <div class="link-title">
              Visit Process Website
            </div>

            <div class="link-sub">
              theprocessrecoverycenter.com
            </div>

          </div>


          <div class="link-arrow">
            ›
          </div>

        </a>


        <a
          class="primary-link"
          href="${escapeAttribute(settings.mapsHref)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ${iconPin()}
          </div>


          <div class="link-copy">

            <div class="link-title">
              Get Directions
            </div>

            <div class="link-sub">
              ${escapeHtml(settings.main_address)}
            </div>

          </div>


          <div class="link-arrow">
            ›
          </div>

        </a>


      </div>


      <div class="section-heading">

        <div class="section-title">
          Recovery Resources
        </div>


        <div class="section-small">
          Community<br>
          Support<br>
          Long-Term Change
        </div>

      </div>


      <div class="resource-grid">

        ${
          visibleResources
            .map(
              resource =>
                renderResource(resource)
            )
            .join('')
        }

      </div>


      ${renderCrisis(crisisResource)}


      <footer class="footer">


        <div class="footer-divider">

          <div class="footer-line"></div>


          <div class="footer-symbol">

            <img
              src="process-mark.png"
              alt="The Process Recovery Center"
            >

          </div>


          <div class="footer-line"></div>

        </div>


        <div class="footer-process-text">
          The Process Recovery Center
        </div>


        ${
          settings.king_logo
            ? `

              <div class="king-wrap">

                <img
                  class="king-logo"
                  src="${escapeAttribute(settings.king_logo)}"
                  alt="King Healthcare Group"
                >

              </div>

            `
            : ''
        }


        <div class="footer-region">
          New England Area and Beyond
        </div>


        <div class="footer-tagline">
          Recovery Starts Here.
        </div>


        <div class="footer-accent"></div>


      </footer>


    </section>

  `;


  app.innerHTML =
    html;

}


function renderResource(resource) {

  const name =
    String(
      resource.name || ''
    );


  const nameLower =
    name.toLowerCase();


  let icon =
    iconPeople();


  if (
    nameLower.includes('respite')
  ) {
    icon =
      iconHome();
  }

  else if (
    nameLower.includes('door')
  ) {
    icon =
      iconDoor();
  }

  else if (
    nameLower.includes('alcoholics') ||
    nameLower.includes('narcotics')
  ) {
    icon =
      iconPeople();
  }


  const displayNumber =
    resource.displayNumber ||
    resource.display_number ||
    '';


  const actionLabel =
    resource.actionLabel ||
    resource.action_label ||
    'Open Resource';


  const isPhone =
    String(
      resource.url || ''
    )
      .toLowerCase()
      .startsWith('tel:');


  return `

    <a
      class="resource-card"
      href="${escapeAttribute(resource.url || '#')}"
      ${isPhone ? '' : 'target="_blank" rel="noopener"'}
    >

      <div class="resource-icon">
        ${icon}
      </div>


      <div class="resource-name">
        ${escapeHtml(name)}
      </div>


      <div class="resource-description">
        ${escapeHtml(resource.description || '')}
      </div>


      <div class="resource-bottom">


        <div>

          ${
            displayNumber
              ? `
                <div class="resource-number">
                  ${escapeHtml(displayNumber)}
                </div>
              `
              : ''
          }


          <div class="resource-action-label">
            ${escapeHtml(actionLabel)}
          </div>

        </div>


        <div class="resource-arrow">
          ›
        </div>


      </div>


    </a>

  `;

}


function renderCrisis(crisis) {

  const displayNumber =
    crisis &&
    (
      crisis.displayNumber ||
      crisis.display_number
    )
      ? (
          crisis.displayNumber ||
          crisis.display_number
        )
      : '988';


  const callUrl =
    crisis &&
    crisis.url
      ? crisis.url
      : 'tel:988';


  return `

    <div class="crisis">


      <div class="crisis-number-block">

        <div class="crisis-icon">
          ${iconPhone()}
        </div>

        <div class="crisis-number">
          ${escapeHtml(displayNumber)}
        </div>

      </div>


      <div class="crisis-divider"></div>


      <div class="crisis-copy">


        <div class="crisis-title">
          Mental Health Crisis Lifeline
        </div>


        <div class="crisis-actions">

          <a
            class="crisis-action"
            href="${escapeAttribute(callUrl)}"
          >
            Call
          </a>

          <span class="crisis-action">
            |
          </span>

          <a
            class="crisis-action"
            href="sms:988"
          >
            Text
          </a>

        </div>


        <div class="crisis-support">
          Support is available 24/7.
        </div>


      </div>


    </div>


    <a
      class="emergency"
      href="tel:911"
    >
      Immediate emergency? Call 911
    </a>

  `;

}


function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


function escapeAttribute(value) {
  return escapeHtml(value);
}


function renderError() {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="error-card">

      <h2>
        Unable to load
      </h2>

      <p>
        Please refresh the page or visit
        The Process Recovery Center website.
      </p>

    </div>

  `;

}

</script>

</body>
</html>
