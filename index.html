<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#031019">

  <meta
    name="description"
    content="The Process Recovery Center staff contact and recovery resources."
  >

  <title>The Process Recovery Center</title>

  <link rel="icon" type="image/png" href="process-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --blue: #5bd1ff;
      --blue-bright: #00b8f4;
      --blue-soft: #b6eaff;

      --navy: #061722;
      --navy-2: #031018;

      --black: #01070b;
      --white: #ffffff;

      --muted: #9eb4bf;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: var(--black);

      -webkit-text-size-adjust: 100%;
    }


    body {
      font-family:
        "Manrope",
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 15% 12%,
          rgba(0,184,244,.11),
          transparent 31%
        ),
        linear-gradient(
          180deg,
          var(--navy) 0%,
          var(--black) 100%
        );
    }


    a {
      color: inherit;
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    svg {
      display: block;
    }


    img {
      user-select: none;
      -webkit-user-drag: none;
    }



    /* =====================================================
       PAGE / SCROLL CONTAINER
    ===================================================== */


    .page {
      position: relative;

      width: 100%;
      max-width: 520px;

      /* 100vh first as a fallback for browsers that don't support dvh
         (older Safari) — modern browsers immediately override it below. */
      height: 100vh;
      height: 100dvh;

      margin: 0 auto;

      overflow-x: hidden;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior-y: contain;

      scroll-behavior: smooth;

      scroll-snap-type:
        y proximity;

      scrollbar-width: none;

      background:
        radial-gradient(
          circle at 92% 46%,
          rgba(0,184,244,.06),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          var(--navy) 0%,
          var(--navy-2) 53%,
          #01080c 100%
        );

      box-shadow:
        0 0 80px rgba(0,0,0,.58);
    }


    .page::-webkit-scrollbar {
      display: none;
    }


    .page::before,
    .page::after {
      display: none !important;
      content: none !important;
    }



    /* =====================================================
       LOADING
    ===================================================== */


    .loading {
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #b8c9d0;

      text-align: center;
    }


    .spinner {
      width: 36px;
      height: 36px;

      margin:
        0 auto
        14px;

      border-radius: 50%;

      border:
        3px solid rgba(91,209,255,.15);

      border-top-color:
        var(--blue);

      animation:
        spin .8s linear infinite;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }



    /* =====================================================
       STATE CARD
       (used for network errors, timeouts, "no staff on this
       link", and "card not found" — replaces the old plain
       white error box so it stays on-brand)
    ===================================================== */


    .state-wrap {
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;
    }


    .state-card {
      width: 100%;
      max-width: 360px;

      padding: 32px 26px;

      text-align: center;

      border:
        1px solid rgba(91,209,255,.30);

      border-radius: 20px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(91,209,255,.09),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          rgba(17,46,64,.96),
          rgba(5,20,29,.98)
        );

      box-shadow:
        0 14px 34px rgba(0,0,0,.30);
    }


    .state-icon {
      width: 44px;
      height: 44px;

      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;

      background:
        linear-gradient(
          145deg,
          #15b8ed,
          #08628f
        );
    }


    .state-icon svg {
      width: 22px;
      height: 22px;
    }


    .state-title {
      font-size: 18px;

      font-weight: 800;
    }


    .state-message {
      margin-top: 8px;

      color:
        var(--muted);

      font-size: 13px;

      line-height: 1.55;
    }


    .state-action {
      display: inline-block;

      margin-top: 20px;

      padding:
        13px
        24px;

      border-radius: 999px;

      color: white;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: .3px;

      background:
        linear-gradient(
          145deg,
          #0da8df,
          #056798
        );

      box-shadow:
        0 8px 22px rgba(0,153,214,.22);
    }



    /* =====================================================
       HERO
    ===================================================== */


    .hero {
      position: relative;

      min-height: 495px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      overflow: hidden;

      isolation: isolate;

      scroll-snap-align: start;

      padding:
        max(
          18px,
          env(safe-area-inset-top)
        )
        20px
        25px;

      background-image:
        linear-gradient(
          180deg,
          rgba(2,9,14,.07) 0%,
          rgba(2,9,14,.11) 24%,
          rgba(2,10,16,.25) 46%,
          rgba(3,15,23,.72) 71%,
          var(--navy) 100%
        ),
        url("bridge-hero.jpg");

      background-size: cover;

      background-position:
        center 44%;
    }


    .hero::before {
      content: "";

      position: absolute;

      inset: 0;

      z-index: -1;

      background:
        radial-gradient(
          circle at 87% 22%,
          rgba(45,188,245,.15),
          transparent 30%
        ),
        linear-gradient(
          90deg,
          rgba(0,50,78,.10),
          transparent 58%
        );

      pointer-events: none;
    }


    .hero::after {
      content: "";

      position: absolute;

      left: -15%;
      right: -15%;
      bottom: -80px;

      height: 180px;

      z-index: -1;

      background: var(--navy);

      filter: blur(45px);

      opacity: .8;
    }



    /* =====================================================
       PROCESS BRAND
    ===================================================== */


    .hero-brand {
      position: absolute;

      top:
        max(
          19px,
          env(safe-area-inset-top)
        );

      left: 20px;

      z-index: 4;

      display: flex;

      align-items: center;

      gap: 11px;

      animation:
        brandIn .8s cubic-bezier(.22,.8,.24,1) both;

      filter:
        drop-shadow(
          0 3px 7px rgba(0,0,0,.65)
        )
        drop-shadow(
          0 8px 20px rgba(0,0,0,.38)
        );
    }


    @keyframes brandIn {

      from {
        opacity: 0;

        transform:
          translateY(-12px)
          scale(.98);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    .hero-process-mark {
      width: 67px;
      height: 67px;

      flex-shrink: 0;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 8px rgba(73,200,246,.22)
        );
    }


    .hero-brand-copy {
      color:
        var(--white);

      text-shadow:
        0 2px 7px rgba(0,0,0,.88),
        0 5px 15px rgba(0,0,0,.48);
    }


    .hero-brand-the {
      margin-bottom: 2px;

      font-size: 10px;

      font-weight: 600;

      line-height: 1;

      letter-spacing: 5px;

      text-transform: uppercase;
    }


    .hero-brand-process {
      font-size: 29px;

      font-weight: 700;

      line-height: .96;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .hero-brand-sub {
      margin-top: 6px;

      color: #d9eff8;

      font-size: 8px;

      font-weight: 600;

      line-height: 1;

      letter-spacing: 3px;

      text-transform: uppercase;
    }



    /* =====================================================
       STAFF
    ===================================================== */


    .hero-content {
      position: relative;

      z-index: 3;

      animation:
        heroIn .9s .08s cubic-bezier(.22,.8,.24,1) both;
    }


    @keyframes heroIn {

      from {
        opacity: 0;

        transform:
          translateY(18px)
          scale(.985);

        filter:
          blur(2px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter:
          blur(0);
      }

    }


    .hero-name {
      max-width: 100%;

      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(
          44px,
          11.4vw,
          57px
        );

      font-weight: 700;

      line-height: .88;

      letter-spacing: -.8px;

      text-wrap: balance;

      text-shadow:
        0 3px 10px rgba(0,0,0,.64),
        0 8px 28px rgba(0,0,0,.42);
    }


    .hero-name.long {
      font-size:
        clamp(
          39px,
          10vw,
          50px
        );
    }


    .hero-name.xlong {
      font-size:
        clamp(
          35px,
          8.8vw,
          45px
        );
    }


    .hero-title {
      display: flex;

      align-items: center;

      width: fit-content;

      max-width: 100%;

      gap: 10px;

      margin-top: 12px;

      color: #e7f0f4;

      font-size: 15px;

      font-weight: 500;

      line-height: 1.3;

      text-shadow:
        0 2px 8px rgba(0,0,0,.65);
    }


    .hero-title::before,
    .hero-title::after {
      content: "";

      width: 28px;
      height: 2px;

      flex-shrink: 0;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--blue-bright),
          var(--blue)
        );

      box-shadow:
        0 0 9px rgba(0,184,244,.4);
    }


    .credentials {
      margin-top: 8px;

      color: #c4eaf8;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1.35px;

      text-transform: uppercase;

      text-shadow:
        0 2px 8px rgba(0,0,0,.65);
    }



    /* =====================================================
       CONTACT BUTTONS
    ===================================================== */


    .contact-actions {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 18px;
    }


    .contact-action {
      position: relative;

      min-width: 0;

      min-height: 102px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding:
        12px
        7px;

      text-align: center;

      border:
        1px solid rgba(96,197,239,.44);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(18,51,70,.94),
          rgba(3,17,25,.97)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 12px 27px rgba(0,0,0,.22);

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    .contact-action:active {
      transform:
        scale(.96);
    }


    .contact-action.primary {
      border-color:
        #38d0ff;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(96,222,255,.28),
          transparent 43%
        ),
        linear-gradient(
          145deg,
          #0da8df,
          #056798
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 8px 30px rgba(0,153,214,.22);
    }


    .contact-action.primary::before {
      content: "";

      position: absolute;

      top: -50%;
      left: -75%;

      width: 50%;
      height: 200%;

      transform:
        rotate(22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.13),
          transparent
        );

      animation:
        callShine 5s ease-in-out infinite;
    }


    @keyframes callShine {

      0%,
      76% {
        left: -75%;
      }

      100% {
        left: 160%;
      }

    }


    .contact-icon {
      width: 29px;
      height: 29px;

      margin-bottom: 8px;

      color:
        var(--white);
    }


    .contact-icon svg {
      width: 100%;
      height: 100%;
    }


    .contact-label {
      color:
        var(--white);

      font-size: 13.5px;

      font-weight: 800;
    }


    .contact-sub {
      max-width: 110px;

      margin-top: 4px;

      overflow: hidden;

      color: #c6d9e1;

      font-size: 9px;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    .contact-action.primary
    .contact-sub {
      color:
        var(--white);

      font-size: 10.5px;

      font-weight: 700;

      font-variant-numeric:
        tabular-nums;
    }



    /* =====================================================
       CONTENT
    ===================================================== */


    .content {
      position: relative;

      z-index: 2;

      width: 100%;

      margin: 0;

      padding:
        0
        17px
        0;
    }



    /* =====================================================
       ADMISSIONS
    ===================================================== */


    .admissions {
      position: relative;

      min-height: 132px;

      overflow: hidden;

      display: flex;

      align-items: center;

      gap: 14px;

      padding: 18px;

      border:
        1px solid rgba(18,199,255,.95);

      border-radius: 20px;

      background:
        #072333;

      box-shadow:
        0 14px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.05);

      transition:
        transform .18s ease;

      scroll-snap-align: start;
    }


    .admissions:active {
      transform:
        scale(.98);
    }


    .admissions::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: .32;

      background-image:
        linear-gradient(
          90deg,
          rgba(2,22,34,.96),
          rgba(3,32,48,.78)
        ),
        url("bridge-hero.jpg");

      background-size: cover;

      background-position:
        center 46%;
    }


    .admissions > * {
      position: relative;

      z-index: 2;
    }


    .admissions-icon {
      position: relative;

      width: 62px;
      height: 62px;

      min-width: 62px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color:
        var(--white);

      background:
        linear-gradient(
          145deg,
          #15b8ed,
          #08628f
        );

      box-shadow:
        0 8px 22px rgba(0,0,0,.24);
    }


    .admissions-icon::after {
      content: "";

      position: absolute;

      inset: -6px;

      border:
        1px solid rgba(91,209,255,.30);

      border-radius: 50%;

      animation:
        phonePulse 2.8s ease-out infinite;
    }


    @keyframes phonePulse {

      0% {
        opacity: .75;

        transform:
          scale(.85);
      }

      75%,
      100% {
        opacity: 0;

        transform:
          scale(1.28);
      }

    }


    .admissions-icon svg {
      width: 30px;
      height: 30px;
    }


    .admissions-copy {
      flex: 1;

      min-width: 0;
    }


    .admissions-kicker {
      color:
        var(--blue-soft);

      font-size: 8px;

      font-weight: 800;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }


    .admissions-title {
      margin-top: 3px;

      font-size: 23px;

      font-weight: 800;

      line-height: 1;

      letter-spacing: -.7px;
    }


    .admissions-title span {
      color:
        var(--blue-bright);
    }


    .admissions-number {
      margin-top: 8px;

      color:
        var(--white);

      font-size: 21px;

      font-weight: 800;

      line-height: 1;

      font-variant-numeric:
        tabular-nums;
    }


    .admissions-sub {
      margin-top: 8px;

      color: #bfe8f7;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 1.25px;

      text-transform: uppercase;
    }


    .admissions-arrow {
      color:
        var(--white);

      font-size: 34px;
    }



    /* =====================================================
       WEBSITE + DIRECTIONS
    ===================================================== */


    .primary-links {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 11px;
    }


    .primary-link {
      min-height: 108px;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 15px;

      border:
        1px solid rgba(105,188,224,.34);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(17,46,64,.96),
          rgba(5,20,29,.98)
        );

      transition:
        transform .18s ease;
    }


    .primary-link:active {
      transform:
        scale(.975);
    }


    .link-icon {
      width: 35px;
      height: 35px;

      min-width: 35px;
    }


    .link-icon svg {
      width: 100%;
      height: 100%;
    }


    .link-copy {
      min-width: 0;

      flex: 1;
    }


    .link-title {
      font-size: 12.5px;

      font-weight: 800;

      line-height: 1.22;
    }


    .link-sub {
      max-width: 130px;

      margin-top: 5px;

      overflow: hidden;

      color:
        var(--muted);

      font-size: 8.5px;

      line-height: 1.4;

      text-overflow: ellipsis;
    }


    .link-arrow {
      font-size: 24px;
    }



    /* =====================================================
       SECTION HEADING
    ===================================================== */


    .section-heading {
      display: flex;

      align-items: flex-end;

      justify-content:
        space-between;

      gap: 12px;

      margin:
        30px
        3px
        14px;

      padding-bottom: 9px;

      border-bottom:
        1px solid rgba(91,209,255,.58);
    }


    .section-title {
      color:
        var(--blue-soft);

      font-size: 15px;

      font-weight: 800;

      letter-spacing: 2.6px;

      text-transform: uppercase;
    }


    .section-small {
      color: #73c9e9;

      font-size: 6.7px;

      font-weight: 700;

      line-height: 1.45;

      letter-spacing: 1.45px;

      text-align: right;

      text-transform: uppercase;
    }



    /* =====================================================
       RESOURCES
    ===================================================== */


    .resource-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;
    }


    .resource-card {
      min-height: 178px;

      display: flex;

      flex-direction: column;

      padding:
        16px
        14px;

      border:
        1px solid rgba(95,190,230,.36);

      border-radius: 18px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(91,209,255,.075),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          #102d3e,
          #061620
        );

      transition:
        transform .18s ease;

      /* Intentionally no scroll-snap-align here: snapping to every
         individual card in a grid made scrolling feel "catchy" rather
         than smooth. Snap points are kept on the major sections only
         (hero, admissions, crisis, footer). */
    }


    .resource-card:active {
      transform:
        scale(.975);
    }


    .resource-icon {
      width: 37px;
      height: 37px;

      margin-bottom: 12px;

      color: #e2f6ff;
    }


    .resource-icon svg {
      width: 100%;
      height: 100%;
    }


    .resource-name {
      font-size: 13.5px;

      font-weight: 800;

      line-height: 1.2;
    }


    .resource-description {
      margin-top: 8px;

      color: #a0b6c1;

      font-size: 9px;

      line-height: 1.45;
    }


    .resource-bottom {
      display: flex;

      align-items: flex-end;

      justify-content:
        space-between;

      gap: 8px;

      margin-top: auto;

      padding-top: 13px;
    }


    .resource-number {
      color:
        var(--white);

      font-size: 15px;

      font-weight: 800;

      font-variant-numeric:
        tabular-nums;
    }


    .phone-resource
    .resource-number {
      color:
        var(--blue-soft);
    }


    .resource-action-label {
      margin-top: 6px;

      color:
        var(--blue);

      font-size: 8px;

      font-weight: 800;

      letter-spacing: .5px;

      text-transform: uppercase;
    }


    .resource-arrow {
      font-size: 25px;
    }



    /* =====================================================
       CRISIS
    ===================================================== */


    .crisis {
      min-height: 145px;

      display: flex;

      align-items: center;

      gap: 13px;

      margin-top: 16px;

      padding: 17px;

      border:
        1px solid rgba(22,199,255,.94);

      border-radius: 20px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(0,184,244,.12),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          #07263a,
          #06141d
        );

      scroll-snap-align: start;
    }


    .crisis-number-block {
      display: flex;

      align-items: center;

      gap: 9px;

      flex-shrink: 0;
    }


    .crisis-icon {

      align-items: center;

      height: 24px;

    .crisis-number {

    .crisis-support {

    /* =====================================================
       FOOTER
    ===================================================== */


    .footer {
      width: 100%;

      padding:
        24px
        12px

      text-align: center;

      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(0,184,244,.07),
          transparent 55%
        );

    }


    .footer-divider {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 13px;
    }


    .footer-line {
      width: 76px;

      max-width: 22vw;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--blue-bright)
        );
    }


    .footer-line:last-child {
      background:
        linear-gradient(
          90deg,
          var(--blue-bright),
          transparent
        );
    }


    .footer-symbol {
      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,184,244,.14),
          transparent 70%
        );
    }


    .footer-symbol img {
      width: 47px;
      height: 47px;

      object-fit: contain;
    }


    .footer-process-text {
      margin-top: 8px;

      color: #bad5e1;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 2.15px;

      text-transform: uppercase;
    }


    .king-wrap {
      width: 132px;

      margin:
        13px
        auto
        0;

      padding:
        7px
        9px;

      border:
        1px solid rgba(255,255,255,.48);

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.93),
          rgba(236,245,248,.86)
        );

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 9px 24px rgba(0,0,0,.17),
        inset 0 1px 0 rgba(255,255,255,.96);
    }


    .king-logo {
      display: block;

      width: 100%;

      max-height: 62px;

      object-fit: contain;

      filter: none;
    }


    .footer-region {
      margin-top: 13px;

      color: #a9cad7;

      font-size: 7.8px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .footer-tagline {
      margin-top: 14px;

      color:
        var(--blue-bright);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 30px;

      font-weight: 600;

      font-style: italic;

      line-height: 1;
    }


    .footer-accent {
      width: 46px;
      height: 3px;

      margin:
        11px
        auto
        0;

      border-radius: 999px;

      background:
        var(--blue-bright);

      box-shadow:
        0 0 12px rgba(0,184,244,.22);
    }



    /* =====================================================
       REVEAL ANIMATIONS
    ===================================================== */


    .reveal {
      opacity: 0;

      transform:
        translateY(22px)
        scale(.985);

      filter:
        blur(2px);

      transition:
        opacity .72s ease,
        transform .72s cubic-bezier(.22,.8,.24,1),
        filter .72s ease;
    }


    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);

      filter:
        blur(0);
    }


    .resource-card.reveal:nth-child(1) {
      transition-delay: .03s;
    }

    .resource-card.reveal:nth-child(2) {
      transition-delay: .10s;
    }

    .resource-card.reveal:nth-child(3) {
      transition-delay: .17s;
    }

    .resource-card.reveal:nth-child(4) {
      transition-delay: .24s;
    }

    .resource-card.reveal:nth-child(5) {
      transition-delay: .31s;
    }

    .resource-card.reveal:nth-child(6) {
      transition-delay: .38s;
    }



    /* =====================================================
       SMALL PHONES
    ===================================================== */


    @media (max-width: 370px) {

      .hero {
        min-height: 470px;
      }


      .hero-process-mark {
        width: 57px;
        height: 57px;
      }


      .hero-brand-process {
        font-size: 24px;
      }


      .hero-name {
        font-size: 40px;
      }


      .hero-name.long {
        font-size: 36px;
      }


      .hero-name.xlong {
        font-size: 32px;
      }


      .hero-title {
        font-size: 13px;
      }


      .contact-actions {
        gap: 6px;
      }


      .contact-action {
        min-height: 96px;

        padding:
          10px
          5px;
      }


      .contact-label {
        font-size: 11.5px;
      }


      .admissions {
        gap: 10px;

        padding: 15px;
      }


      .admissions-icon {
        width: 53px;
        height: 53px;

        min-width: 53px;
      }


      .admissions-title {
        font-size: 20px;
      }


      .admissions-number {
        font-size: 18px;
      }

    }



    @media (prefers-reduced-motion: reduce) {

      .page {
        scroll-behavior: auto;
      }


      *,
      *::before,
      *::after {
        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          .001ms !important;
      }


      .reveal {
        opacity: 1;

        transform: none;

        filter: none;
      }

    }

  </style>

</head>



<body>


<main
  id="app"
  class="page"
>

  <div class="loading">

    <div>

      <div class="spinner"></div>

      Loading...

    </div>

  </div>

</main>



<script>


const API_URL =
  'https://script.google.com/macros/s/AKfycbzefgAa3hJz9h2emDoa_4hhlxl99fIB_k_h5TEq1AIKmBXukcEx9llpglAsLqabXYOJ/exec';

const FALLBACK_WEBSITE =
  'https://www.theprocessrecoverycenter.com';

// If the backend hasn't responded in this long, stop waiting silently
// and show a real message instead of an endless spinner.
const LOAD_TIMEOUT_MS = 12000;


const params =
  new URLSearchParams(
    window.location.search
  );


const staffId =
  String(
    params.get('staff') || ''
  )
    .toLowerCase()
    .trim();


let dataLoaded = false;
let loadTimeoutId = null;



window.processCardData =
  function(data) {

    dataLoaded = true;

    if (loadTimeoutId) {
      clearTimeout(loadTimeoutId);
    }

    handleResponse(data);

  };



function loadData() {

  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?staff=' +
    encodeURIComponent(staffId) +
    '&callback=processCardData' +
    '&t=' +
    Date.now();


  script.onerror =
    renderNetworkError;


  document.body.appendChild(
    script
  );


  loadTimeoutId =
    setTimeout(
      renderTimeoutError,
      LOAD_TIMEOUT_MS
    );

}


loadData();



function handleResponse(data) {

  if (!data || !data.ok) {

    renderState({
      title: 'Something Went Wrong',
      message: "We couldn't load this card. Please refresh, or visit our website directly.",
      actionLabel: 'Visit Website',
      actionHref: FALLBACK_WEBSITE
    });

    return;

  }


  if (!data.requestedStaffId) {

    renderState({
      title: 'Welcome',
      message: "This link isn't tied to a specific team member yet. Visit our site to learn more or get in touch.",
      actionLabel: 'Visit Website',
      actionHref:
        (data.settings && data.settings.main_website) ||
        FALLBACK_WEBSITE
    });

    return;

  }


  if (!data.staffFound) {

    renderState({
      title: 'Card Not Found',
      message: "We couldn't find this team member's card. It may have been updated — please visit our website.",
      actionLabel: 'Visit Website',
      actionHref:
        (data.settings && data.settings.main_website) ||
        FALLBACK_WEBSITE
    });

    return;

  }


  renderPage(data);

}



function iconPhone() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
    </svg>
  `;

}


function iconMail() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
  `;

}


function iconContact() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"

      stroke-linejoin="round"

    >
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M19 8v6"></path>
      <path d="M22 11h-6"></path>
    </svg>
  `;

}


function iconGlobe() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"

      <path d="M12 3a14 14 0 0 1 0 18"></path>
      <path d="M12 3a14 14 0 0 0 0 18"></path>

  `;

}


function iconPin() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"></path>
      <circle cx="12" cy="10" r="2.5"></circle>
    </svg>
  `;

}


function iconHome() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 11 12 3l9 8"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>

}


function iconDoor() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 21h14"></path>
      <path d="M7 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17"></path>
      <circle cx="14" cy="12" r=".8" fill="currentColor" stroke="none"></circle>
    </svg>
  `;

}


function iconPeople() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="8" cy="8" r="3"></circle>
      <circle cx="16" cy="8" r="3"></circle>
      <path d="M2 20c0-3 2.5-6 6-6s6 3 6 6"></path>
      <path d="M10 20c0-3 2.5-6 6-6s6 3 6 6"></path>
    </svg>
  `;

}


function iconWarn() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 9v4"></path>
      <path d="M12 17h.01"></path>
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
    </svg>
  `;

}



const ICON_MAP = {
  home: iconHome,
  door: iconDoor,
  people: iconPeople,
  phone: iconPhone,
  mail: iconMail,
  globe: iconGlobe,
  pin: iconPin,
  contact: iconContact
};


function resolveResourceIcon(resource, nameLower) {

  // Prefer an explicit "Icon" value from the sheet (home / door /
  // people / phone / mail / globe / pin / contact) when present.
  const explicit =
    String(
      resource.icon || ''
    )
      .toLowerCase()
      .trim();


  if (
    explicit &&
    ICON_MAP[explicit]
  ) {

    return ICON_MAP[explicit]();

  }


  // Otherwise fall back to guessing from the resource name, same as before.

  if (
    nameLower.includes('respite')
  ) {

    return iconHome();

  }


  if (
    nameLower.includes('door')
  ) {

    return iconDoor();

  }


  return iconPeople();

}



function renderPage(data) {

  const app =
    document.getElementById('app');


  const staff =
    data.staff || null;


  const settings =
    data.settings || {};


  const resources =
    data.resources || [];


  if (!staff) {

    handleResponse(data);

    return;

  }


  document.title =
    staff.name +
    ' | The Process Recovery Center';


  const nameLength =
    String(
      staff.name || ''
    ).length;


  let nameClass = '';


  if (
    nameLength > 24
  ) {

    nameClass = 'xlong';

  }

  else if (
    nameLength > 18
  ) {

    nameClass = 'long';

  }


  const crisisResource =
    resources.find(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() ===
        'crisis'
    );


  const visibleResources =
    resources.filter(
      resource =>
        String(
          resource.category || ''
        )
          .toLowerCase()
          .trim() !==
        'crisis'
    );


  app.innerHTML = `


    <section class="hero">


      <div class="hero-brand">

        <img
          class="hero-process-mark"
          src="process-mark.png"
          alt=""
        >


        <div class="hero-brand-copy">

          <div class="hero-brand-the">
            The
          </div>

          <div class="hero-brand-process">
            Process
          </div>

          <div class="hero-brand-sub">
            Recovery Center
          </div>

        </div>

      </div>



      <div class="hero-content">


        <h1 class="hero-name ${nameClass}">
          ${escapeHtml(staff.name)}
        </h1>


        ${
          staff.title
            ? `
              <div class="hero-title">
                ${escapeHtml(staff.title)}
              </div>
            `
            : ''
        }


        ${
          staff.credentials
            ? `
              <div class="credentials">
                ${escapeHtml(staff.credentials)}
              </div>
            `
            : ''
        }



        <div class="contact-actions">


          
            class="contact-action primary"
            href="${escapeAttribute(staff.phoneHref)}"
          >

            <div class="contact-icon">
              ${iconPhone()}
            </div>

            <div class="contact-label">
              Call
            </div>

            <div class="contact-sub">
              ${escapeHtml(staff.phone)}
            </div>

          </a>



          
            class="contact-action"
            href="mailto:${escapeAttribute(staff.email)}"
          >

            <div class="contact-icon">
              ${iconMail()}
            </div>

            <div class="contact-label">
              Email
            </div>

            <div class="contact-sub">
              Send a Message
            </div>

          </a>



          
            class="contact-action"
            href="${API_URL}?staff=${encodeURIComponent(staff.id)}&vcard=1"
          >

            <div class="contact-icon">
              ${iconContact()}
            </div>

            <div class="contact-label">
              Save Contact
            </div>

            <div class="contact-sub">
              Add to Phone
            </div>

          </a>


        </div>


      </div>


    </section>



    <section class="content">


      
        class="admissions reveal"
        href="${escapeAttribute(settings.admissionsHref)}"
      >

        <div class="admissions-icon">
          ${iconPhone()}
        </div>


        <div class="admissions-copy">

          <div class="admissions-kicker">
            Talk With Admissions
          </div>

          <div class="admissions-title">
            ADMISSIONS
            <span>24/7</span>
          </div>

          <div class="admissions-number">
            ${escapeHtml(settings.admissions_phone)}
          </div>

          <div class="admissions-sub">
            Real people. Real help. Any time.
          </div>

        </div>


        <div class="admissions-arrow">
          ›
        </div>

      </a>



      <div class="primary-links reveal">


        
          class="primary-link"
          href="${escapeAttribute(settings.main_website)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ${iconGlobe()}
          </div>

          <div class="link-copy">

            <div class="link-title">
              Visit Process Website
            </div>

            <div class="link-sub">
              theprocessrecoverycenter.com
            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>



        
          class="primary-link"
          href="${escapeAttribute(settings.mapsHref)}"
          target="_blank"
          rel="noopener"
        >

          <div class="link-icon">
            ${iconPin()}
          </div>

          <div class="link-copy">

            <div class="link-title">
              Get Directions
            </div>

            <div class="link-sub">
              ${escapeHtml(settings.main_address)}
            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>


      </div>



      <div class="section-heading reveal">

        <div class="section-title">
          Recovery Resources
        </div>

        <div class="section-small">
          Community<br>
          Support<br>
          Long-Term Change
        </div>

      </div>



      <div class="resource-grid">

        ${
          visibleResources
            .map(
              resource =>
                renderResource(
                  resource
                )
            )
            .join('')
        }

      </div>



      <div class="reveal">

        ${renderCrisis(
          crisisResource
        )}

      </div>



      <footer class="footer reveal">


        <div class="footer-divider">

          <div class="footer-line"></div>

          <div class="footer-symbol">

            <img
              src="process-mark.png"
              alt=""
            >

          </div>

          <div class="footer-line"></div>

        </div>


        <div class="footer-process-text">
          The Process Recovery Center
        </div>


        ${
          settings.king_logo
            ? `

              <div class="king-wrap">

                <img
                  class="king-logo"
                  src="${escapeAttribute(settings.king_logo)}"
                  alt="King Healthcare Group"
                >

              </div>

            `
            : ''
        }


        <div class="footer-region">
          New England Area and Beyond
        </div>


        <div class="footer-tagline">
          Recovery Starts Here.
        </div>


        <div class="footer-accent"></div>


      </footer>


    </section>

  `;


  setupReveal();

}



function renderResource(resource) {

  const name =
    String(
      resource.name || ''
    );


  const nameLower =
    name.toLowerCase();


  const url =
    String(
      resource.url || ''
    ).trim();


  const isPhone =
    url
      .toLowerCase()
      .startsWith('tel:');


  const icon =
    resolveResourceIcon(
      resource,
      nameLower
    );


  const displayNumber =
    resource.displayNumber ||
    resource.display_number ||
    '';


  let actionLabel =
    resource.actionLabel ||
    resource.action_label ||
    '';


  if (!actionLabel) {

    if (
      nameLower.includes('respite')
    ) {

      actionLabel =
        'Call Respite';

    }

    else if (
      nameLower.includes('door')
    ) {

      actionLabel =
        'Call Doorways';

    }

    else if (
      nameLower.includes('alcoholics') ||
      nameLower.includes('narcotics')
    ) {

      actionLabel =
        'Find Meetings';

    }

    else if (
      isPhone
    ) {

      actionLabel =
        'Call Now';

    }

    else {

      actionLabel =
        'Visit Resource';

    }

  }


  return `

    
      class="resource-card reveal ${isPhone ? 'phone-resource' : ''}"
      href="${escapeAttribute(url || '#')}"
      ${isPhone ? '' : 'target="_blank" rel="noopener"'}
    >

      <div class="resource-icon">
        ${icon}
      </div>


      <div class="resource-name">
        ${escapeHtml(name)}
      </div>


      ${
        resource.description
          ? `
            <div class="resource-description">
              ${escapeHtml(resource.description)}
            </div>
          `
          : ''
      }


      <div class="resource-bottom">

        <div>

          ${
            displayNumber
              ? `
                <div class="resource-number">
                  ${escapeHtml(displayNumber)}
                </div>
              `
              : ''
          }

          <div class="resource-action-label">
            ${escapeHtml(actionLabel)}
          </div>

        </div>


        <div class="resource-arrow">
          ›
        </div>

      </div>


    </a>

  `;

}



function renderCrisis(crisis) {

  const displayNumber =
    crisis &&
    (
      crisis.displayNumber ||
      crisis.display_number
    )
      ? (
          crisis.displayNumber ||
          crisis.display_number
        )
      : '988';


  const callUrl =
    crisis &&
    crisis.url
      ? crisis.url
      : 'tel:988';


  const crisisName =
    crisis &&
    crisis.name
      ? crisis.name
      : 'Mental Health Crisis Lifeline';


  return `

    <div class="crisis">


      <div class="crisis-number-block">

        <div class="crisis-icon">
          ${iconPhone()}
        </div>

        <div class="crisis-number">
          ${escapeHtml(displayNumber)}
        </div>

      </div>


      <div class="crisis-divider"></div>


      <div class="crisis-copy">

        <div class="crisis-title">
          ${escapeHtml(crisisName)}
        </div>


        <div class="crisis-buttons">

          
            class="crisis-button call"
            href="${escapeAttribute(callUrl)}"
          >
            Call 988
          </a>

          
            class="crisis-button"
            href="sms:988"
          >
            Text 988
          </a>

        </div>


        <div class="crisis-support">
          Support is available 24/7.
        </div>

      </div>


    </div>


    
      class="emergency"
      href="tel:911"
    >
      Immediate emergency? Call 911
    </a>

  `;

}



function setupReveal() {

  const page =
    document.querySelector(
      '.page'
    );


  const elements =
    document.querySelectorAll(
      '.reveal'
    );


  if (
    !(
      'IntersectionObserver'
      in
      window
    )
  ) {

    elements.forEach(
      element =>
        element
          .classList
          .add(
            'visible'
          )
    );

    return;

  }


  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(

          entry => {

            if (
              entry.isIntersecting
            ) {

              entry
                .target
                .classList
                .add(
                  'visible'
                );


              observer
                .unobserve(
                  entry.target
                );

            }

          }

        );

      },

      {
        root: page,
        threshold: .04,
        rootMargin:
          '0px 0px 80px 0px'
      }

    );


  elements.forEach(
    element =>
      observer.observe(
        element
      )
  );

}



function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


function escapeAttribute(value) {

  return escapeHtml(value);

}



// =====================================================
// STATE SCREENS
//
// One on-brand component for every non-happy-path: network
// failure, load timeout, no ?staff= on the link, and staff
// not found. Replaces the old plain white error box.
// =====================================================

function renderState(options) {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="state-wrap">

      <div class="state-card">

        <div class="state-icon">
          ${iconWarn()}
        </div>

        <div class="state-title">
          ${escapeHtml(options.title)}
        </div>

        <p class="state-message">
          ${escapeHtml(options.message)}
        </p>

        ${
          options.actionHref
            ? `
              
                class="state-action"
                href="${escapeAttribute(options.actionHref)}"
                target="_blank"
                rel="noopener"
              >
                ${escapeHtml(options.actionLabel || 'Learn More')}
              </a>
            `
            : ''
        }

      </div>

    </div>

  `;

}


function renderNetworkError() {

  if (dataLoaded) {

    return;

  }

  if (loadTimeoutId) {

    clearTimeout(loadTimeoutId);

  }


  renderState({
    title: 'Connection Issue',
    message: "We couldn't load this card. Check your connection and try refreshing.",
    actionLabel: 'Visit Website',
    actionHref: FALLBACK_WEBSITE
  });

}


function renderTimeoutError() {

  if (dataLoaded) {

    return;

  }


  renderState({
    title: 'Taking Longer Than Usual',
    message: "This is taking a while to load. You can keep waiting, or visit our website directly.",
    actionLabel: 'Visit Website',
    actionHref: FALLBACK_WEBSITE
  });

}


// Safety net: some in-app browsers (notably ones opened from a QR/
// Camera scan) can fail to run CSS animations or fire
// IntersectionObserver correctly on the very first load. If that
// happens, content meant to fade in can get stuck invisible. This
// forces everything visible after a short delay regardless, so a
// flaky first paint can never leave real content hidden.
setTimeout(function() {
  document.querySelectorAll('.reveal').forEach(function(el) {
    el.classList.add('visible');
  });

  var brand = document.querySelector('.hero-brand');
  var content = document.querySelector('.hero-content');

  if (brand) {
    brand.style.opacity = '1';
    brand.style.transform = 'none';
    brand.style.filter = 'none';
  }

  if (content) {
    content.style.opacity = '1';
    content.style.transform = 'none';
    content.style.filter = 'none';
  }
}, 1200);


</script>
